<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GM Pulse — Samaradorlik Nazorati</title>
<meta name="description" content="Xodimlar davomati, vazifalar, KPI, jarima va bonuslar nazorati">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#149E93">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface2:#ECF1F5; --ink:#17242E; --muted:#62748A;
  --line:#E2E8EF; --accent:#149E93; --accent-ink:#0B6B63; --accent-soft:#DDF2F0;
  --gold:#C98F2B; --gold-soft:#F7EDD9; --danger:#D8534B; --danger-soft:#FBE7E5;
  --success:#3B9E66; --success-soft:#E2F3E9; --info:#4C82E0; --info-soft:#E5EDFB;
  --shadow:0 1px 2px rgba(23,36,46,.05),0 8px 24px -12px rgba(23,36,46,.12);
  --r:14px;
}
html[data-theme="dark"]{
  --bg:#0C141D; --surface:#141F2B; --surface2:#1B2A38; --ink:#E9EFF5; --muted:#8DA2B5;
  --line:#243548; --accent:#1BB5A8; --accent-ink:#7ADDD4; --accent-soft:#123A38;
  --gold:#E0AC4A; --gold-soft:#3A2F17; --danger:#E4736C; --danger-soft:#3E1F1D;
  --success:#5BBF85; --success-soft:#173226; --info:#7AA3EC; --info-soft:#1B2B45;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 28px -14px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.5;min-height:100vh;
  transition:background .25s,color .25s;
}
h1,h2,h3,h4{font-family:'Sora',sans-serif;line-height:1.25}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface2);
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{font-size:12.5px;font-weight:700;color:var(--muted);display:block;margin:12px 0 5px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Kirish ekrani ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{max-width:430px;width:100%}
.login-logo{width:56px;height:56px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.login-logo svg{width:28px;height:28px}
.login-card h1{font-size:26px;margin-bottom:6px}
.login-card>p{color:var(--muted);margin-bottom:22px}
.role-btn{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:10px;
  box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.role-btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.role-btn .meta b{display:block;font-size:15px}
.role-btn .meta span{font-size:12.5px;color:var(--muted)}
.role-btn .tag{margin-left:auto}

/* ---------- Umumiy tuzilma ---------- */
#app{display:none}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;
  display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand .mark svg{width:18px;height:18px}
.brand b{font-family:'Sora';font-size:15px}
.brand span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.nav-btn{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;
  font-weight:600;font-size:14px;color:var(--muted);transition:background .12s,color .12s;text-align:left;width:100%}
.nav-btn svg{width:19px;height:19px;flex-shrink:0}
.nav-btn:hover{background:var(--surface2)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent-ink)}
.sidebar .spacer{flex:1}
.side-user{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line)}
.side-user .meta b{font-size:13.5px;display:block}
.side-user .meta span{font-size:11.5px;color:var(--muted)}
.logout{color:var(--muted);padding:6px;border-radius:8px;margin-left:auto}
.logout:hover{color:var(--danger);background:var(--danger-soft)}

.main{padding:22px 26px 90px;max-width:1180px;width:100%;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.topbar h2{font-size:21px}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.topbar .right{margin-left:auto;display:flex;gap:9px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.12s}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
.icon-btn svg{width:18px;height:18px}

/* ---------- Komponentlar ---------- */
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:#fff;flex-shrink:0;font-family:'Sora'}
.avatar.lg{width:56px;height:56px;font-size:18px}
.avatar.sm{width:28px;height:28px;font-size:10.5px}
.tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag.accent{background:var(--accent-soft);color:var(--accent-ink)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.danger{background:var(--danger-soft);color:var(--danger)}
.tag.success{background:var(--success-soft);color:var(--success)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.muted{background:var(--surface2);color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-bottom:16px}
.stat{padding:16px 18px}
.stat .lbl{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.stat .lbl svg{width:15px;height:15px}
.stat .val{font-family:'Sora';font-size:23px;font-weight:700}
.stat .delta{font-size:12px;font-weight:700;margin-top:4px}
.section-title{font-size:15px;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.section-title span{color:var(--muted);font-weight:600;font-size:12.5px;margin-left:auto}

.chart-card{padding:18px}
.chart-card h3{font-size:14.5px;margin-bottom:2px}
.chart-card .sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.grid.charts{grid-template-columns:1fr 1fr}
@media(max-width:900px){.grid.charts{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.rowhover:hover td{background:var(--surface2)}
.t-wrap{overflow-x:auto}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:11px;
  font-weight:700;font-size:13.5px;transition:.12s;border:1px solid transparent}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.success{background:var(--success);color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;align-items:start}
@media(max-width:1000px){.kanban{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.kanban{grid-template-columns:1fr}}
.kcol{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:11px}
.kcol h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:7px;
  color:var(--muted);padding:2px 4px 10px}
.kcol h4 .count{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:1px 8px;font-size:11.5px}
.kdot{width:8px;height:8px;border-radius:50%}
.task-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;box-shadow:var(--shadow)}
.task-card .ttl{font-weight:700;font-size:13.5px;margin-bottom:4px}
.task-card .desc{font-size:12.5px;color:var(--muted);margin-bottom:9px}
.task-card .foot{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.task-card .foot .due{margin-left:auto;font-weight:700}
.task-card .due.late{color:var(--danger)}
.task-card .actions{display:flex;gap:7px;margin-top:10px}

/* Davomat / soat kartasi */
.clock-card{padding:22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  background:linear-gradient(135deg,var(--surface),var(--accent-soft));margin-bottom:16px}
.clock-card .time{font-family:'Sora';font-size:40px;font-weight:700;letter-spacing:.01em}
.clock-card .date{color:var(--muted);font-weight:600;font-size:13px}
.clock-card .right{margin-left:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.check-state{font-size:13px;font-weight:700}

/* Ro'yxatlar */
.fb-item{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.fb-item:last-child{border-bottom:none}
.fb-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fb-icon svg{width:17px;height:17px}
.fb-item .meta{flex:1}
.fb-item .meta b{font-size:13.5px;display:block}
.fb-item .meta span{font-size:12.5px;color:var(--muted)}
.fb-item .amount{font-family:'Sora';font-weight:700;font-size:14.5px;white-space:nowrap}
.fb-item .amount small{display:block;font-family:'Manrope';font-weight:600;color:var(--muted);font-size:11px;text-align:right}

.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.emp-card{padding:16px;display:flex;flex-direction:column;gap:11px}
.emp-card .head{display:flex;gap:12px;align-items:center}
.emp-card .head b{display:block;font-size:14.5px}
.emp-card .head span{font-size:12px;color:var(--muted)}
.emp-mini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.emp-mini div{background:var(--surface2);border-radius:10px;padding:7px 4px}
.emp-mini b{font-size:13px;display:block}
.emp-mini span{font-size:10.5px;color:var(--muted);font-weight:700}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,24,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:18px;backdrop-filter:blur(3px)}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:18px;max-width:440px;width:100%;padding:22px;max-height:90vh;overflow-y:auto;border:1px solid var(--line)}
.modal h3{font-size:17px;margin-bottom:4px}
.modal .sub{font-size:13px;color:var(--muted)}
.modal .foot{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);
  padding:11px 20px;border-radius:12px;font-weight:700;font-size:13.5px;opacity:0;transition:.3s;z-index:99;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px;align-items:center}
.bell-badge{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;
  min-width:17px;height:17px;border-radius:99px;display:none;align-items:center;justify-content:center;padding:0 4px}
.notif-panel{position:absolute;right:0;top:46px;width:305px;max-height:340px;overflow-y:auto;display:none;z-index:45;padding:5px}
.notif-panel.open{display:block}
.notif-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 11px;
  border-radius:10px;font-size:12.5px;font-weight:600;line-height:1.4}
.notif-item:hover{background:var(--surface2)}
.btn.rec{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
.day-chip{display:inline-flex;margin:0}
.day-chip input{display:none}
.day-chip span{padding:7px 13px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--surface2)}
.day-chip input:checked+span{background:var(--accent);color:#fff;border-color:var(--accent)}
.emp-pick{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;max-height:170px;overflow-y:auto;padding:2px}
.pick-chip{display:inline-flex;margin:0}
.pick-chip input{display:none}
.pick-chip span{padding:7px 12px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;cursor:pointer;background:var(--surface2)}
.pick-chip input:checked+span{background:var(--accent);color:#fff;border-color:var(--accent)}
.month-sel{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);
  font-family:inherit;font-size:12.5px;font-weight:700;padding:0 8px;width:auto;max-width:150px;cursor:pointer}
.month-sel.archive{border-color:var(--gold);color:var(--gold);background:var(--gold-soft, rgba(212,160,23,.12))}
.archive-bar{background:var(--gold-soft, rgba(212,160,23,.12));border:1px solid var(--gold);color:var(--gold);
  border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;font-weight:700;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.archive-bar .btn{margin-left:auto}
.ledger{overflow-x:auto}
.ledger-head,.ledger-row,.ledger-foot{display:grid;grid-template-columns:82px 70px 1fr 110px 110px 120px;gap:8px;padding:9px 14px;align-items:center;font-size:12.5px;min-width:600px}
.ledger-head{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--line)}
.ledger-row{border-bottom:1px dashed var(--line)}
.ledger-foot{background:var(--surface2);font-weight:800;border-top:2px solid var(--line)}
.ledger .r{text-align:right}
.ledger .muted{color:var(--muted)}
.snab-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.snab-top .btn{flex:1 1 auto;justify-content:center}
.avatar.has-img{padding:0;overflow:hidden}
.avatar.has-img img{width:100%;height:100%;object-fit:cover;display:block}
.photo-edit{position:relative;display:inline-block}
.photo-edit .cam{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:13px;cursor:pointer;border:2px solid var(--surface)}
/* Davomat akkordeoni */
.acc summary{display:flex;align-items:center;gap:9px;cursor:pointer;list-style:none;padding:13px 16px;font-size:14px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::before{content:"›";font-weight:800;color:var(--muted);transition:transform .15s}
.acc[open]>summary::before{transform:rotate(90deg)}
.day-acc{margin-bottom:11px;padding:0}
.dept-acc{border-top:1px solid var(--line)}
.dept-acc summary{padding:11px 16px;font-size:13px}
.acc-body{padding:4px 12px 12px}
.sub2{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.att-row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.att-row:last-child{border-bottom:none}
.att-who{display:flex;align-items:center;gap:9px;min-width:170px;flex:1}
.att-who b{font-size:13.5px}
.att-cells{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.att-cells>div{display:flex;flex-direction:column;gap:2px}
.att-cells b{font-size:13.5px}
@media(max-width:700px){
  .att-row{flex-direction:column;align-items:stretch;gap:8px;background:var(--surface2);border-radius:12px;padding:11px 12px;margin-bottom:8px;border-bottom:none}
  .att-who{min-width:0}
  .att-cells{gap:10px;justify-content:space-between}
  .att-cells>div{flex:1;min-width:90px}
  .att-row>.btn{align-self:flex-end}
  .acc summary{padding:12px 12px;flex-wrap:wrap}
  .acc-body{padding:4px 8px 10px}
  .kpi-table{display:none}
  .kpi-cards{display:grid;gap:10px}
}
.kpi-cards{display:none}
@media(max-width:820px){.notif-panel{position:fixed;right:12px;left:12px;top:auto;width:auto;margin-top:6px}}
.filters select,.filters input{width:auto;min-width:150px}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13.5px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px}
.bar-row .nm{width:92px;font-weight:700;flex-shrink:0}
.bar-row .track{flex:1;height:9px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:99px;background:var(--accent);transition:width .6s ease}
.bar-row .pc{width:40px;text-align:right;font-weight:800}

/* ---------- Mobil ---------- */
.bottom-nav{display:none}
.more-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}
.more-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface2);color:var(--text);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.more-item svg{width:24px;height:24px}
.more-item.active{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .main{padding:16px 14px 96px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);
    border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;font-weight:700;color:var(--muted);padding:6px 2px;border-radius:10px}
  .bottom-nav button.active{color:var(--accent-ink)}
  .bottom-nav svg{width:20px;height:20px}
  .clock-card .time{font-size:32px}
  .clock-card .right{margin-left:0;align-items:flex-start;width:100%}
}
/* Telefon: hech narsa kesilmasin. overflow-x:hidden OLIB TASHLANDI —
   u ekrandan chiqqan tugmalarni ko'rinmas qilib qo'yardi va ularga yetib bo'lmasdi.
   O'rniga: har bir element ekran eniga majburan sig'diriladi. */
html,body{max-width:100%;overflow-x:clip}
*{min-width:0}
.grid,.kanban,.stats{min-width:0}
.grid>*,.kanban>*{min-width:0;max-width:100%}
.grid.charts>*{min-width:0}
.chart-card svg{max-width:100%}
.pay-cards{display:none}
/* Keng qatorlar kesilmasdan pastga o'ralib tushsin */
.filters,.actions,.foot{flex-wrap:wrap}
.att-row,.att-cells,.fb-item,.emp-card,.task-card .foot{flex-wrap:wrap}
.att-cells>div{min-width:0}
.fb-item .meta{min-width:0}
.fb-item .meta b,.fb-item .meta span{overflow-wrap:anywhere}
/* Har qanday element ekrandan chiqib ketmasin */
.card,.modal,.task-card,.att-row{max-width:100%}
.modal{box-sizing:border-box}
img,svg,video,audio,table{max-width:100%}

  const R = 6371000, r = x => x * Math.PI / 180;
  const dla = r(la2 - la1), dlo = r(lo2 - lo1);
  const h = Math.sin(dla/2)**2 + Math.cos(r(la1)) * Math.cos(r(la2)) * Math.sin(dlo/2)**2;

}

function contractState(iso){
  if (!iso) return { cls:"muted", txt:"sana kiritilmagan", label:"—", d:null };
  const d = daysTo(iso);
  if (d < 0)    return { cls:"danger",  txt:`muddati o'tgan (${uzDate(iso)}, ${Math.abs(d)} kun oldin)`, label:"O'tgan", d };
  if (d <= 30)  return { cls:"danger",  txt:`${d} kun qoldi — ${uzDate(iso)}`, label:`${d} kun`, d };
  if (d <= 90)  return { cls:"gold",    txt:`${d} kun qoldi (${Math.round(d/30)} oy) — ${uzDate(iso)}`, label:`${d} kun`, d };
  if (d <= 180) return { cls:"info",    txt:`${Math.round(d/30)} oy qoldi — ${uzDate(iso)}`, label:`${Math.round(d/30)} oy`, d };
  return             { cls:"success", txt:`amalda — ${uzDate(iso)} gacha (${Math.round(d/30)} oy)`, label:`${Math.round(d/30)} oy`, d };
}
function contractTag(iso, short=false){
  const s = contractState(iso);
  if (!iso) return `<span class="tag muted">📄 shartnoma sanasi yo'q</span>`;
  return `<span class="tag ${s.cls}" title="Shartnoma: ${uzDate(iso)}">📄 ${short ? s.label : s.txt}</span>`;
}

/* ===== BRAUZER BILDIRISHNOMASI + OVOZ =====
   Ilova ochiq (yoki fonda) bo'lsa — telefon/kompyuter bildirishnomasi chiqadi va ovoz beradi. */
function beep(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = 880; g.gain.value = 0.15;
    o.connect(g); g.connect(ctx.destination); o.start();
    setTimeout(() => { o.frequency.value = 1175; }, 120);
    setTimeout(() => { o.stop(); ctx.close(); }, 260);
  } catch(e){}
}
async function notifyEnable(){
  if (!("Notification" in window)) return toast("Bu brauzer bildirishnomani qo'llamaydi");
  const p = await Notification.requestPermission();
  if (p === "granted") { toast("Bildirishnomalar yoqildi 🔔"); beep(); notifyUser("GM Pulse", "Bildirishnomalar yoqildi ✓"); }
  else toast("Ruxsat berilmadi — brauzer sozlamalaridan yoqing");
}
function notifyUser(title, body){
  beep();
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
      navigator.serviceWorker.ready.then(reg => reg.showNotification(title, { body, icon: "icon-192.png", badge: "icon-192.png", vibrate: [150, 80, 150], tag: "gm-" + Date.now() }));
    } else new Notification(title, { body, icon: "icon-192.png" });
  } catch(e){}
}
/* Yangi bildirishnomalarni aniqlab, faqat YANGILARI uchun ovoz + bildirishnoma */
let __seenNotif = null;
function checkNewNotifs(){
  if (!USER) return;
  const items = notifList().map(n => n.text);
  if (__seenNotif === null) { __seenNotif = new Set(items); return; } // birinchi yuklash — eskilarni belgilaymiz
  const fresh = items.filter(t => !__seenNotif.has(t));
  if (fresh.length) {
    notifyUser("GM Pulse", fresh.length === 1 ? fresh[0] : `${fresh.length} ta yangi bildirishnoma: ${fresh[0]}`);
    fresh.forEach(t => __seenNotif.add(t));
  }
}

/* Rasm yuklash (admin har kimga, xodim o'ziga) */
async function uploadPhoto(empId, input){
  const file = input.files[0]; if (!file) return;
  if (!file.type.startsWith("image/")) { input.value=""; return toast("Faqat rasm fayli"); }
  if (file.size > 5 * 1024 * 1024) { input.value=""; return toast("Rasm 5 MB dan katta"); }
  toast("Rasm yuklanmoqda...");
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
  const path = `${empId}/avatar.${ext}`;
  const { error } = await sb.storage.from("avatars")
    .upload(path, file, { upsert: true, contentType: file.type, cacheControl: "0" });
  input.value = "";
  if (error) return toast("Yuklanmadi: " + error.message);
  const { data: pub } = sb.storage.from("avatars").getPublicUrl(path);
  const url = pub.publicUrl + "?v=" + Date.now();   // kesh yangilanishi uchun
  if (USER.role === "admin") {
    // Admin — to'g'ridan-to'g'ri yozadi
    const { data, error: e2 } = await sb.from("profiles").update({ photo: url }).eq("id", empId).select();
    if (e2) return toast("Saqlanmadi: " + e2.message);
    if (!data || !data.length) return toast(permErr("supabase-update-15.sql"));
  } else {
    // Xodim — faqat O'Z rasmini, xavfsiz funksiya orqali (boshqa maydonlarga tegmaydi)
    const { error: e2 } = await sb.rpc("set_my_photo", { url });
    if (e2) return toast(permErrMsg("Saqlanmadi: " + e2.message, "supabase-update-16.sql"));
  }
  const emp = empById(empId); if (emp) emp.photo = url;
  if (String(USER.id) === String(empId)) USER.photo = url;
  toast("Rasm yangilandi ✓"); render();
}
async function removePhoto(empId){
  const { error } = USER.role === "admin"
    ? await sb.from("profiles").update({ photo: null }).eq("id", empId)
    : await sb.rpc("set_my_photo", { url: null });
  if (error) return toast("Xatolik: " + error.message);
  const emp = empById(empId); if (emp) emp.photo = null;
  if (String(USER.id) === String(empId)) USER.photo = null;
  toast("Rasm olib tashlandi"); render();
}

/* ============ HISOB-KITOBLAR ============ */
function minutes(t){ const [h,m] = t.split(":").map(Number); return h*60+m; }
const LUNCH_END = "14:00";
const OT_GRACE = 10; // daqiqa: shu oraliqdagi erta kelish/kech ketish ortiqcha vaqt hisoblanmaydi
/* Qo'shimcha vaqt (9:00 dan oldin + 18:00 dan keyin), daqiqada.
   10 daqiqagacha farq imtiyoz — na hisoblanadi, na tasdiq so'raladi. */
function otMinutes(a){
  if (!a.out) return 0;
  // Yakshanba — dam kuni: ishlagan BUTUN vaqti qo'shimcha hisoblanadi
  if (isSunday(a.date)) return Math.max(0, minutes(a.out) - minutes(a.in) - LUNCH_MAX);
  const early = Math.max(0, minutes(WORK_START) - minutes(a.in));
  const lateOut = Math.max(0, minutes(a.out) - minutes("18:00"));
  return (early > OT_GRACE ? early : 0) + (lateOut > OT_GRACE ? lateOut : 0);
}
const LUNCH_MAX = 60; // belgilangan obed: 60 daqiqa (13:00–14:00)
let FINE_PER_MIN = 0; // 1 daqiqa kechikish uchun jarima (admin belgilaydi)
/* Kechikkan daqiqalar (kelish). Ruxsat bilan kechirilgan bo'lsa — 0 */
/* Yakshanba — dam kuni. Kelgan bo'lsa bu ortiqcha mehnat: kechikish hisoblanmaydi. */
function isSunday(dateIso){ return new Date(dateIso + "T12:00:00").getDay() === 0; }
function lateMinutes(a){
  if (!a || a.lateExcused) return 0;
  if (isSunday(a.date)) return 0;   // dam kuni ishga chiqqan — kechikish yo'q
  const lv = approvedLeave(a.emp, a.date);
  if (lv && (lv.kind === "late" || lv.kind === "absent")) return 0; // oldindan ruxsat berilgan
  return Math.max(0, minutes(a.in) - minutes(WORK_START));
}
/* Obeddan kech qaytish daqiqalari (1 soatdan ortig'i). Kechirilgan bo'lsa — 0 */
function lunchLateMinutes(a){
  if (!a || a.lunchExcused || !a.lunchBack) return 0;
  if (isSunday(a.date)) return 0;   // dam kunida obed nazorati yo'q
  if (approvedLeave(a.emp, a.date)) return 0; // o'sha kunga ruxsat bor
  return Math.max(0, minutes(a.lunchBack) - minutes(LUNCH_END)); // 14:00 dan keyingi ortiqcha
}
/* Kechikish uchun avtomatik jarima (1 daqiqa narxi × kechikkan daqiqalar) */
function lateFine(a){
  if (!a) return 0;
  if (a.fineOverride != null) return +a.fineOverride;  // admin qo'lda o'zgartirgan
  if (!FINE_PER_MIN) return 0;
  return Math.round((lateMinutes(a) + lunchLateMinutes(a)) * FINE_PER_MIN);
}
/* Reytingga ta'sir qiladigan kechikish (kechirilgan hisobga olinmaydi) */
function countsLate(a){ return lateMinutes(a) > 0; }
function countsLunchLate(a){ return lunchLateMinutes(a) > 0; }
/* Ishlagan soat: obed vaqti ayriladi; qo'shimcha vaqt FAQAT tasdiqlansa qo'shiladi.
   Obed: agar xodim "chiqdim/qaytdim" bosgan bo'lsa — HAQIQIY tafovut hisoblanadi,
   1 soatdan oshsa ortig'i ham ayriladi. Bosmagan bo'lsa — standart 1 soat ayriladi. */
function lunchMinutes(a){
  // Standart 1 soat; 14:00 dan kech qaytilsa ortiqcha daqiqalar ham ayriladi
  if (a.lunchBack) return LUNCH_MAX + Math.max(0, minutes(a.lunchBack) - minutes(LUNCH_END));
  return LUNCH_MAX;
}
function workedHours(a){
  if (!a.out) return null;
  const approved = a.ot === "approved";
  const effIn  = approved ? minutes(a.in)  : Math.max(minutes(a.in),  minutes(WORK_START));
  const effOut = approved ? minutes(a.out) : Math.min(minutes(a.out), minutes("18:00"));
  const lunch = lunchMinutes(a);
  let h = (effOut - effIn) / 60 - lunch / 60;
  return Math.max(0, h);
}
function inViewMonth(d){ return d && d.slice(0,7) === VIEW_MONTH; }
function empAttendance(id){ return ATTENDANCE.filter(a => String(a.emp) === String(id) && inViewMonth(a.date)); }
function empFB(id){ return FINEBONUS.filter(f => String(f.emp) === String(id) && inViewMonth(f.date)); }
function sumFB(id, type){
  return empFB(id).filter(f => f.type === type).reduce((s,f) => s + f.amount, 0);
}
// Oy boshidan ishlab topilgani — SOATBAY hisob:
// soatlik stavka = oylik ÷ (26 kun × 8 soat) = oylik ÷ 208
// hisoblangan = soatlik × real ishlagan soat (ortiqcha soat qo'shiladi, kam ishlagani ayriladi)
function earnedToDate(e){
  const att = empAttendance(e.id);
  let hours = 0, days = 0, lateFineSum = 0;
  att.forEach(a => {
    const h = workedHours(a); if (h !== null) { hours += h; days++; }
    lateFineSum += lateFine(a); // kechikish uchun avtomatik jarima
  });
  const hourRate = e.salary / PLAN_TOTAL;
  const base = hourRate * hours;
  const planSoFar = days * PLAN_HOURS;
  const diff = hours - planSoFar;
  const piece = (typeof pieceTotal === "function") ? pieceTotal(e.id) : 0; // donabay ish haqi
  const manualFine = sumFB(e.id,"fine");
  const fine = manualFine + lateFineSum;   // jami jarima (ALOHIDA hisob)
  const bonus = sumFB(e.id,"bonus");
  return { base, hours, days, hourRate, planSoFar, diff,
           bonus, fine, manualFine, lateFine: lateFineSum, piece,
           // Maosh: ishlagan soat + donabay ish + bonus. Jarima ARALASHTIRILMAYDI.
           total: base + piece + bonus,
           // Jarima alohida ko'rsatiladi va alohida undiriladi
           fineTotal: fine };
}
// Samaradorlik: 60% bajarilgan vazifalar + 20% muddatida topshirish + 20% o'z vaqtida kelish
// effDetail — KPI nimadan yig'ilganining to'liq raqamlari
function effDetail(id){
  // Butunlay yopilgan vazifalar KPI hisobiga kirmaydi (ish bekor qilingan)
  const t = TASKS.filter(x => isTaskDoer(x, id) && x.status !== "closed");
  const done = t.filter(x => x.status === "done");
  const onTime = done.filter(x => !x.doneAt || x.doneAt <= x.due);  // kun aniqligida
  const at = empAttendance(id);
  const punct = at.filter(a => !countsLate(a) && !countsLunchLate(a));
  const sundays = at.filter(a => isSunday(a.date));   // dam kunida ishga chiqqan kunlar
  const tScore = t.length ? done.length / t.length : 0;
  const oScore = done.length ? onTime.length / done.length : 0;
  const pScore = at.length ? punct.length / at.length : 0;
  // KPI faqat MAVJUD ma'lumot qismlaridan hisoblanadi (yo'q qism 100% deb olinmaydi).
  // Umuman ma'lumot bo'lmasa — KPI 0 va "ma'lumot yig'ilmoqda" holati.
  const parts = [];
  if (t.length)    parts.push([tScore, 0.6]);
  if (done.length) parts.push([oScore, 0.2]);
  if (at.length)   parts.push([pScore, 0.2]);
  const wSum = parts.reduce((s,p) => s + p[1], 0);
  let kpi = wSum ? Math.round(parts.reduce((s,p) => s + p[0]*p[1], 0) / wSum * 100) : 0;
  // Yakshanba (dam kuni) ishga chiqqan har bir kun uchun +2% bonus, jami 10% gacha.
  // Bu ortiqcha mehnat — reytingga IJOBIY ta'sir qiladi.
  const sundayBonus = Math.min(10, sundays.length * 2);
  if (wSum) kpi = Math.min(100, kpi + sundayBonus);
  return {
    tTotal: t.length, tDone: done.length, onTime: onTime.length,
    days: at.length, punct: punct.length, noData: wSum === 0,
    sundays: sundays.length, sundayBonus,
    tPc: Math.round(tScore * 100), oPc: Math.round(oScore * 100), pPc: Math.round(pScore * 100),
    kpi,
  };
}
function efficiency(id){ return effDetail(id).kpi; }
// Bo'lim bo'yicha jamlangan raqamlar
function deptDetail(deptId){
  const list = EMPLOYEES.filter(e => String(e.dept) === String(deptId));
  const a = { tTotal:0, tDone:0, onTime:0, days:0, punct:0, emps:list.length };
  list.forEach(e => { const d = effDetail(e.id);
    a.tTotal+=d.tTotal; a.tDone+=d.tDone; a.onTime+=d.onTime; a.days+=d.days; a.punct+=d.punct; });
  a.late = a.days - a.punct;
  a.kpi = deptEfficiency(deptId);
  return a;
}

  const list = EMPLOYEES.filter(e => e.dept === deptId);

/* ============ SVG GRAFIKLAR ============ */
function svgLineChart(){
  const W = 460, H = 210, P = 34;
  const min = 55, max = 100;
  const x = i => P + i * (W - P - 12) / (MONTHLY.labels.length - 1);
  const y = v => H - P + 6 - (v - min) / (max - min) * (H - P - 24);
  const series = DEPTS.slice(0, 4).map(d => ({ key: d.id, color: d.color }));
  let grid = "", labels = "";
  [60,70,80,90,100].forEach(v => {
    grid += `<line x1="${P}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
             <text x="${P-7}" y="${y(v)+4}" font-size="10" fill="var(--muted)" text-anchor="end">${v}</text>`;
  });
  MONTHLY.labels.forEach((l,i) => {
    labels += `<text x="${x(i)}" y="${H-8}" font-size="10.5" fill="var(--muted)" text-anchor="middle">${l}</text>`;
  });
  let paths = "";
  series.forEach(s => {
    const vals = monthlySeries(s.key);
    const pts = vals.map((v,i) => `${x(i)},${y(v)}`).join(" ");
    paths += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    vals.forEach((v,i) => { paths += `<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${s.color}"/>`; });
  });
  const legend = DEPTS.map(d =>
    `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:12px;font-weight:700;color:var(--muted)">
      <span style="width:9px;height:9px;border-radius:3px;background:${d.color};display:inline-block"></span>${d.name}</span>`).join("");
  return `<div style="margin-bottom:8px">${legend}</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${labels}${paths}</svg>`;
}

/* ============ BILDIRISHNOMALAR (ilova ichida) ============ */
function notifList(){
  const items = [], seen = new Set();
  const ids = scopeEmployees().map(e => String(e.id));
  // Vazifani BERGAN odamga (yoki admin) tasdiq so'rovi keladi
  TASKS.filter(t => t.status==="review" && !isTaskDoer(t, USER.id)
      && (String(t.by) === String(USER.id) || USER.role === "admin")).forEach(t => {
      seen.add(t.id);
      items.push({ ic:"✅", cls:"info", text:`«${t.title}» tasdiq kutmoqda — ${empById(t.emp)?.name.split(" ")[0]||""}`, go:"tasks" });
    });
  TASKS.filter(t => isTaskDoer(t, USER.id) && t.status === "new").forEach(t => {
    seen.add(t.id);
    items.push({ ic:"🆕", cls:"accent", text:`Yangi vazifa: «${t.title}» (muddat ${uzDate(t.due)})`, go:"tasks" });
  });
  TASKS.filter(t => (isTaskDoer(t, USER.id) || taskEmps(t).some(e => ids.includes(String(e))))
      && t.status !== "done" && t.status !== "closed" && t.due < TODAY && !seen.has(t.id))
    .forEach(t => items.push({ ic:"⚠️", cls:"danger", text:`Muddati o'tdi: «${t.title}» — ${taskEmps(t).map(e=>empById(e)?.name.split(" ")[0]||"").join(", ")}`, go:"tasks" }));
  ATTENDANCE.filter(a => a.ot === "pending" && canApproveOT(a) && ids.includes(String(a.emp))).forEach(a =>
    items.push({ ic:"⏱", cls:"gold", text:`${empById(a.emp).name.split(" ")[0]} — qo'shimcha ${otMinutes(a)} daqiqa tasdiq kutmoqda (${uzDate(a.date)})`, go:"attendance" }));
  LEAVE_REQS.filter(r => r.status === "pending" && canDecideLeave(r)).forEach(r =>
    items.push({ ic:"📝", cls:"gold",
      text:`${empById(r.emp)?.name.split(" ")[0]} — ${leaveKindLabel(r.kind)}ga ruxsat so'radi (${uzDate(r.date)}${r.fromTime?" "+r.fromTime:""})`, go:"attendance" }));
  LEAVE_REQS.filter(r => String(r.emp)===String(USER.id) && r.status !== "pending" && r.date >= TODAY).forEach(r =>
    items.push({ ic: r.status==="approved"?"✅":"❌", cls: r.status==="approved"?"success":"danger",
      text:`${uzDate(r.date)} — ${leaveKindLabel(r.kind)} so'rovingiz ${r.status==="approved"?"tasdiqlandi":"rad etildi"}`, go:"me" }));
  if (canSeeSnab()) {
    const r = snabRole();
    if (["admin","zavsklad"].includes(r)) SNAB_ITEMS.filter(i=>!i.received).forEach(i => { const o = SNAB_ORDERS.find(x=>String(x.id)===String(i.ord)); if (o && snabStatus(o)!=="closed") items.push({ ic:"📦", cls:"gold", text:`${o.num}: ${i.name} — qabul qilishni kutmoqda`, go:"snab" }); });
    if (["admin","kassir"].includes(r)) SNAB_PAYS.filter(p=>p.status==="requested").forEach(p => { const o = SNAB_ORDERS.find(x=>String(x.id)===String(p.ord)); if (o) items.push({ ic:"💳", cls:"gold", text:`${o.num}: ${fmtMoney(p.amount)} to'lov so'raldi — ${p.purpose||""}`, go:"snab" }); });
    if (["admin","snab"].includes(r)) SNAB_PAYS.filter(p=>p.status==="paid").forEach(p => { const o = SNAB_ORDERS.find(x=>String(x.id)===String(p.ord)); if (o) items.push({ ic:"⏳", cls:"info", text:`${o.num}: ${fmtMoney(p.amount)} to'landi — postavshik tasdig'i kutilmoqda`, go:"snab" }); });
  }
  (() => { const byEmp = {}; PIECE_ENTRIES.filter(p => p.status==="pending" && canApproveOT({emp:p.emp})).forEach(p => { byEmp[p.emp]=(byEmp[p.emp]||0)+1; });
    Object.entries(byEmp).forEach(([id,n]) => items.push({ ic:"📦", cls:"gold", text:`${empById(id)?.name.split(" ")[0]} — ${n} ta donabay yozuv tasdiq kutmoqda`, go:"piece" })); })();
  ATTENDANCE.filter(a => a.inField && a.inAppr === "pending" && canApproveOT({emp:a.emp}) && ids.includes(String(a.emp))).forEach(a =>
    items.push({ ic:"🚶", cls:"info", text:`${empById(a.emp).name.split(" ")[0]} — tashqaridan kelishni tasdiqlash (${uzDate(a.date)})`, go:"attendance" }));
  ATTENDANCE.filter(a => a.outField && a.outAppr === "pending" && canApproveOT({emp:a.emp}) && ids.includes(String(a.emp))).forEach(a =>
    items.push({ ic:"🚶", cls:"info", text:`${empById(a.emp).name.split(" ")[0]} — tashqarida ish tugatishni tasdiqlash (${uzDate(a.date)})`, go:"attendance" }));
  if (USER.role === "admin" || isExec(USER.role))
    EMPLOYEES.filter(e => e.contract && daysTo(e.contract) <= 30).forEach(e =>
      items.push({ ic:"📄", cls:"gold", text: daysTo(e.contract) < 0
        ? `${e.name} — shartnoma muddati O'TGAN (${uzDate(e.contract)})`
        : `${e.name} — shartnoma tugashiga ${daysTo(e.contract)} kun`, go:"employees" }));
  const dismissed = notifDismissed();
  return items.filter(n => !dismissed.has(n.text));
}
function notifKey(){ return "gm_notif_dismissed_" + (USER ? USER.id : "x"); }
function notifDismissed(){ try { return new Set(JSON.parse(localStorage.getItem(notifKey()) || "[]")); } catch(e){ return new Set(); } }
/* Hozirgi bildirishnomalarni "o'qilgan" deb yashirish. Yangi hodisa bo'lsa yana chiqadi. */
function notifClear(){
  const cur = notifList().map(n => n.text);
  const set = notifDismissed(); cur.forEach(t => set.add(t));
  try { localStorage.setItem(notifKey(), JSON.stringify([...set].slice(-300))); } catch(e){}
  toast("Bildirishnomalar tozalandi"); renderBell();
}
function renderBell(){
  const list = notifList();
  const badge = $("#bellBadge");
  badge.style.display = list.length ? "flex" : "none";
  badge.textContent = list.length;
  $("#notifPanel").innerHTML = (list.length
    ? list.map(n => `<button class="notif-item" onclick="toggleNotif();go('${n.go}')"><span>${n.ic}</span><span>${esc(n.text)}</span></button>`).join("")
    : `<div class="empty" style="padding:18px">Yangi bildirishnoma yo'q</div>`)
    + (list.length ? `<button class="notif-item" onclick="notifClear()" style="border-top:1px solid var(--line);color:var(--muted)"><span>🧹</span><span>Hammasini o'qilgan deb belgilash</span></button>` : "")
    + `<button class="notif-item" onclick="toggleNotif();notifyEnable()" style="border-top:1px solid var(--line);color:var(--accent)"><span>🔔</span><span>${("Notification" in window && Notification.permission==="granted") ? "Telefon bildirishnomasi yoqilgan ✓" : "Telefon bildirishnomasini yoqish (ovoz bilan)"}</span></button>`;
}
function toggleNotif(){ $("#notifPanel").classList.toggle("open"); }
document.addEventListener("click", e => {
  if (!e.target.closest("#bellWrap")) $("#notifPanel")?.classList.remove("open");
});

/* ============ CSV EKSPORT (Excel ochadi) ============ */
function downloadCSV(name, rows){
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name + ".csv"; a.click();
  URL.revokeObjectURL(a.href);
  toast("CSV yuklab olindi — Excel'da oching");
}
function exportPayroll(){
  const rows = [["Xodim","Lavozim","Oylik maosh","Soatlik stavka","Ishlagan soat","Reja soat","Farq (soat)","Hisoblangan","Bonus","Maosh (jarimasiz)","Jarima: kechikish","Jarima: qo'lda","Jarima jami (alohida)"]];
  scopeEmployees().forEach(e => {
    const r = earnedToDate(e);
    rows.push([e.name, e.pos, e.salary, Math.round(r.hourRate), r.hours.toFixed(1), r.planSoFar,
               r.diff.toFixed(1), Math.round(r.base), r.bonus, Math.round(r.total),
               Math.round(r.lateFine), Math.round(r.manualFine), Math.round(r.fine)]);
  });
  downloadCSV("hisob-kitob_" + VIEW_MONTH, rows);
}
function exportAttendance(){
  const ids = scopeEmployees().map(e=>e.id);
  const rows = [["Xodim","Sana","Kelgan","Ketgan","Ishlagan soat","Kechikish"]];
  ATTENDANCE.filter(a => ids.includes(a.emp)).forEach(a => {
    rows.push([empById(a.emp).name, a.date, a.in, a.out ?? "", a.out ? workedHours(a).toFixed(1) : "", a.late ? "ha" : "yo'q"]);
  });
  downloadCSV("davomat_" + VIEW_MONTH, rows);
}

/* --- Hujjatlar (Supabase Storage) --- */
let DOC_TYPES = [], EMP_DOCS = [];
async function loadDocTypes(){
  if (!CLOUD) return;
  const [dt, ed] = await Promise.all([
    sb.from("doc_types").select("*").order("sort"),
    sb.from("emp_docs").select("*"),
  ]);
  if (dt.data) DOC_TYPES = dt.data.map(d => ({ id: d.id, name: d.name, required: d.required, sort: d.sort }));
  if (ed.data) EMP_DOCS = ed.data.map(d => ({ emp: d.emp, file: d.file,
    types: (d.doc_types && d.doc_types.length) ? d.doc_types : (d.doc_type ? [d.doc_type] : []) }));
}
/* Xodimda qaysi majburiy hujjatlar bor / yetishmayapti */
function docStatus(empId){
  const req = DOC_TYPES.filter(d => d.required);
  const mine = EMP_DOCS.filter(d => String(d.emp) === String(empId));
  // Bitta fayl ichida bir nechta hujjat bo'lishi mumkin — belgilangan barcha turlarni yig'amiz
  const covered = new Set();
  mine.forEach(m => (m.types || []).forEach(t => covered.add(String(t))));
  const have = req.filter(r => covered.has(String(r.id)));
  const missing = req.filter(r => !covered.has(String(r.id)));
  return { total: req.length, have: have.length, missing, ok: req.length > 0 && missing.length === 0 };
}

/* Fayl nomini Supabase Storage qabul qiladigan holatga keltirish.
   Sabab: o'zbek/rus harflari, bo'shliq va maxsus belgilar "Invalid key" xatosini beradi. */
function safeFileName(name){
  const dot = name.lastIndexOf(".");
  let base = dot > 0 ? name.slice(0, dot) : name;
  let ext  = dot > 0 ? name.slice(dot + 1).toLowerCase() : "";
  const map = { "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo","ж":"j","з":"z","и":"i",
    "й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u",
    "ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"i","ь":"","э":"e","ю":"yu","я":"ya",
    "ў":"o","қ":"q","ғ":"g","ҳ":"h","ʻ":"","ʼ":"","'":"","'":"","'":"" };
  base = base.toLowerCase().split("").map(ch => map[ch] !== undefined ? map[ch] : ch).join("");
  base = base.replace(/[^a-z0-9._-]+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
  if (!base) base = "hujjat";
  base = base.slice(0, 60);
  ext = ext.replace(/[^a-z0-9]/g, "").slice(0, 8);
  return ext ? `${base}.${ext}` : base;
}
async function uploadDoc(empId, input){
  const file = input.files[0]; if (!file) return;
  if (file.size > 10 * 1024 * 1024) { input.value=""; return toast("Fayl 10 MB dan katta"); }
  toast("Yuklanmoqda...");
  const picked = [...document.querySelectorAll(".docTypeChk:checked")].map(i => +i.value);
  const clean = safeFileName(file.name);
  const stamped = Date.now().toString(36) + "-" + clean; // nom to'qnashuvining oldini oladi
  const { error } = await sb.storage.from("docs")
    .upload(`${empId}/${stamped}`, file, { upsert: true, contentType: file.type || "application/octet-stream" });
  input.value = "";
  if (error) return toast("Yuklanmadi: " + error.message);
  // Hujjat turlarini belgilash
  if (picked.length) {
    const { data: d2, error: e2 } = await sb.from("emp_docs")
      .upsert({ emp: empId, doc_types: picked, doc_type: picked[0], file: stamped }, { onConflict: "emp,file" })
      .select();
    if (e2) { toast("Turlar belgilanmadi: " + e2.message); }
    else if (!d2 || !d2.length) { toast(permErrMsg("Turlar yozilmadi", "supabase-update-15.sql")); }
    else {
      // Mahalliy ro'yxatni darrov yangilaymiz (bazani kutmasdan)
      EMP_DOCS = EMP_DOCS.filter(x => !(String(x.emp)===String(empId) && x.file===stamped));
      EMP_DOCS.push({ emp: empId, file: stamped, types: picked });
      const names = picked.map(p => DOC_TYPES.find(t=>String(t.id)===String(p))?.name).filter(Boolean);
      toast(`Yuklandi ✓ Belgilandi: ${names.join(", ")}`);
    }
  } else {
    toast("Yuklandi ✓ (hujjat turi belgilanmadi — 🏷 tugmasi bilan keyin belgilashingiz mumkin)");
  }
  await loadDocs(empId);
  render();
}
async function downloadDoc(empId, name){
  const { data, error } = await sb.storage.from("docs").createSignedUrl(`${empId}/${name}`, 300);
  if (error || !data) return toast("Ochib bo'lmadi: " + (error?.message || ""));
  window.open(data.signedUrl, "_blank");
}
async function deleteDoc(empId, name){
  const { error } = await sb.storage.from("docs").remove([`${empId}/${name}`]);
  if (error) return toast("Xatolik: " + error.message);
  toast("Hujjat o'chirildi"); loadDocs(empId);
}

/* ================= ASSISTENT (rahbar uchun) =================
   Dasturning O'Z ma'lumotlaridan aniq hisoblab javob beradi — raqamlarda adashmaydi.
   Savol o'zbekcha tahlil qilinadi: davr (bu hafta/oy, o'tgan oy, oy nomi), mavzu
   (kechikish, vazifa, zakaz, savdo, davomat, jarima, bonus, KPI), xodim yoki bo'lim nomi. */
let AST_HISTORY = [];
let AST_CACHE = {}; // {ym: {att, fb, orders, piece}} — oylar bo'yicha yuklangan ma'lumot

/* Kerakli oy(lar) ma'lumotini yuklash (cloud) */
async function astLoadMonth(ym){
  if (AST_CACHE[ym]) return AST_CACHE[ym];
  if (!CLOUD) {
    const inM = d => d && d.slice(0,7) === ym;
    return AST_CACHE[ym] = { att: ATTENDANCE.filter(a=>inM(a.date)), fb: FINEBONUS.filter(f=>inM(f.date)),
      orders: ORDERS.filter(o=>inM(o.date)), piece: PIECE_ENTRIES.filter(p=>inM(p.date)) };
  }
  const [y,m] = ym.split("-").map(Number);
  const from = ym + "-01", to = isoLocal(new Date(y, m, 0));
  const [at, fb, od, pe] = await Promise.all([
    sb.from("attendance").select("*").gte("date", from).lte("date", to),
    sb.from("fine_bonus").select("*").gte("date", from).lte("date", to),
    sb.from("orders").select("*").gte("date", from).lte("date", to),
    sb.from("piece_entries").select("*").gte("date", from).lte("date", to),
  ]);
  return AST_CACHE[ym] = {
    att: (at.data||[]).map(a => ({ emp:a.emp, date:a.date, in:a.check_in?a.check_in.slice(0,5):null, out:a.check_out?a.check_out.slice(0,5):null,
      late:a.late, lateExcused:!!a.late_excused, lunchBack:a.lunch_back?a.lunch_back.slice(0,5):null, lunchExcused:!!a.lunch_excused,
      ot:a.ot_status||"none", fineOverride:a.fine_override!=null?+a.fine_override:null, inField:!!a.in_field, outField:!!a.out_field })),
    fb: (fb.data||[]).map(f => ({ emp:f.emp, type:f.type, amount:+f.amount, reason:f.reason, date:f.date })),
    orders: (od.data||[]).map(o => ({ date:o.date, customer:o.customer, productName:o.product_name, qty:+o.qty, price:+o.price, total:+o.total, company:o.company, by:o.created_by })),
    piece: (pe.data||[]).map(p => ({ emp:p.emp, date:p.date, qty:+p.qty, price:+p.price })),
  };
}
/* Davrni aniqlash */
function astPeriod(q){
  const now = new Date(TODAY + "T12:00:00");
  const ymOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  const monthIdx = UZ_MONTHS.findIndex(m => q.includes(m.toLowerCase()));
  if (q.includes("bu hafta") || q.includes("shu hafta") || q.includes("hafta")) {
    const d = new Date(now); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow); // dushanba
    const from = isoLocal(d); const e = new Date(d); e.setDate(e.getDate()+6);
    return { from, to: isoLocal(e) < TODAY ? isoLocal(e) : TODAY, label: "bu hafta", months:[ymOf(d), ymOf(e)] };
  }
  if (q.includes("bugun")) return { from: TODAY, to: TODAY, label: "bugun", months:[CUR_MONTH] };
  if (q.includes("kecha")) { const d=new Date(now); d.setDate(d.getDate()-1); const s=isoLocal(d); return { from:s, to:s, label:"kecha", months:[ymOf(d)] }; }
  if (q.includes("o'tgan oy") || q.includes("otgan oy") || q.includes("oldingi oy")) {
    const d = new Date(now.getFullYear(), now.getMonth()-1, 1); const ym = ymOf(d);
    return { from: ym+"-01", to: isoLocal(new Date(d.getFullYear(), d.getMonth()+1, 0)), label: monthLabelLow(ym), months:[ym] };
  }
  if (monthIdx >= 0) {
    let y = now.getFullYear(); const ym = `${y}-${String(monthIdx+1).padStart(2,"0")}`;
    const yMatch = q.match(/20\d\d/); const yy = yMatch ? +yMatch[0] : y;
    const ym2 = `${yy}-${String(monthIdx+1).padStart(2,"0")}`;
    return { from: ym2+"-01", to: isoLocal(new Date(yy, monthIdx+1, 0)), label: monthLabelLow(ym2), months:[ym2] };
  }
  if (q.includes("oylar kesimida") || q.includes("oylar bo") || q.includes("har oy") || q.includes("dinamika")) {
    const months = monthOptions().slice().reverse();
    return { from: months[0]+"-01", to: TODAY, label: "oylar kesimida", months, byMonth: true };
  }
  return { from: CUR_MONTH+"-01", to: TODAY, label: "bu oy", months:[CUR_MONTH] };
}
/* Xodim / bo'lim / kompaniya nomini topish */
function astWho(q){
  const emp = EMPLOYEES.find(e => e.role !== "admin" && e.name.toLowerCase().split(" ").some(w => w.length > 3 && new RegExp("\\b" + w + "\\b").test(q)));
  // Bo'lim faqat "bo'lim" so'zi bilan tanilsin ("savdo bo'limi"), aks holda "savdo" = sotuv mavzusi
  const dept = (q.includes("bo'lim") || q.includes("bolim"))
    ? DEPTS.find(d => q.includes(d.name.toLowerCase().replace(" bo'limi","")))
    : null;
  const comp = companies().find(c => q.includes(c.toLowerCase()));
  return { emp, dept, comp };
}
function astEmpSet(who){
  let list = EMPLOYEES.filter(e => e.role !== "admin" && !isExec(e.role));
  if (who.emp) list = [who.emp];
  else if (who.dept) list = list.filter(e => String(e.dept) === String(who.dept.id));
  else if (who.comp) list = list.filter(e => empCompany(e) === who.comp);
  return list;
}
function astFmtList(items, max=8){
  if (!items.length) return "";
  const shown = items.slice(0, max).map(x => "• " + x).join("\n");
  return shown + (items.length > max ? `\n… va yana ${items.length-max} ta` : "");
}
/* ASOSIY: savolga javob */
async function astAnswer(qRaw){
  const q = qRaw.toLowerCase().replace(/[?.,!]/g," ").replace(/\s+/g," ").trim();
  const per = astPeriod(q), who = astWho(q);
  const emps = astEmpSet(who);
  const ids = new Set(emps.map(e => String(e.id)));
  const scopeTxt = who.emp ? who.emp.name : who.dept ? who.dept.name : who.comp ? who.comp : "barcha xodimlar";
  // Ma'lumotni yuklaymiz
  const data = { att:[], fb:[], orders:[], piece:[] };
  for (const ym of [...new Set(per.months)]) { const d = await astLoadMonth(ym); ["att","fb","orders","piece"].forEach(k => data[k].push(...d[k])); }
  const inRange = d => d >= per.from && d <= per.to;
  const att = data.att.filter(a => inRange(a.date) && ids.has(String(a.emp)));
  const fb = data.fb.filter(f => inRange(f.date) && ids.has(String(f.emp)));
  const orders = data.orders.filter(o => inRange(o.date) && (!who.comp || o.company === who.comp) && (!who.emp || String(o.by)===String(who.emp.id)) && (!who.dept || ids.has(String(o.by))));
  const piece = data.piece.filter(p => inRange(p.date) && ids.has(String(p.emp)));
  const name = id => empById(id)?.name.split(" ")[0] || "?";
  const lateOf = a => (a.lateExcused || isSunday(a.date)) ? 0 : Math.max(0, minutes(a.in) - minutes(WORK_START));

  // --- Oylar kesimida ---
  if (per.byMonth) {
    const rows = [];
    for (const ym of per.months) {
      const d = await astLoadMonth(ym);
      const a = d.att.filter(x => ids.has(String(x.emp)));
      const o = d.orders.filter(x => (!who.comp || x.company===who.comp) && (!who.emp || String(x.by)===String(who.emp.id)) && (!who.dept || ids.has(String(x.by))));
      const late = a.filter(x => lateOf(x) > 0).length;
      const hrs = a.reduce((s,x)=> s + (x.out ? Math.max(0,(Math.min(minutes(x.out),minutes("18:00"))-Math.max(minutes(x.in),minutes(WORK_START)))/60-1) : 0), 0);
      const sales = o.reduce((s,x)=>s+x.total,0);
      const tk = TASKS.filter(t => t.due && t.due.slice(0,7)===ym && taskEmps(t).some(e=>ids.has(String(e))) && t.status!=="closed");
      const done = tk.filter(t=>t.status==="done").length;
      rows.push(`${monthLabel(ym)}: davomat ${a.length} kun, kechikish ${late}, ${hrs.toFixed(0)} soat, vazifa ${done}/${tk.length}, zakaz ${o.length} ta = ${fmtMoney(sales)}`);
    }
    return `📊 ${scopeTxt} — oylar kesimida:\n${rows.join("\n")}`;
  }

  const wantSales = /savdo|sotuv|zakaz|buyurtma|tushum|mijoz/.test(q);
  const wantLate = /kech|kechik/.test(q);
  const wantTasks = /vazifa|topshiriq|bajaril/.test(q);
  const wantAtt = /davomat|keldi|kelmadi|kelgan|ishga chiq|ishlagan|soat/.test(q);
  const wantFine = /jarima/.test(q), wantBonus = /bonus|mukofot/.test(q);
  const wantKpi = /kpi|samaradorlik|reyting|eng yaxshi|eng yomon/.test(q);
  const wantPiece = /donabay/.test(q);
  const wantAbsent = /kelmadi|kelmagan|yo'q|yoq|absent/.test(q);
  const out = [];

  if (wantLate) {
    const lates = att.filter(a => lateOf(a) > 0);
    const byEmp = {}; lates.forEach(a => { byEmp[a.emp] = byEmp[a.emp] || {n:0,min:0}; byEmp[a.emp].n++; byEmp[a.emp].min += lateOf(a); });
    const people = Object.keys(byEmp);
    out.push(`⏰ Kechikish (${per.label}, ${scopeTxt}): ${people.length} kishi, jami ${lates.length} marta.`);
    out.push(astFmtList(people.sort((a,b)=>byEmp[b].n-byEmp[a].n).map(id => `${name(id)} — ${byEmp[id].n} marta, ${byEmp[id].min} daq`)));
    const fine = lates.reduce((s,a)=> s + (a.fineOverride!=null ? a.fineOverride : lateOf(a)*FINE_PER_MIN), 0);
    if (FINE_PER_MIN) out.push(`Kechikish jarimasi: ${fmtMoney(fine)} so'm`);
  }
  if (wantAbsent && !wantLate) {
    const days = [...new Set(att.map(a=>a.date))];
    const missing = [];
    days.forEach(d => { if (isSunday(d)) return; emps.forEach(e => { if (!att.some(a=>String(a.emp)===String(e.id)&&a.date===d)) missing.push(`${uzDate(d)} — ${e.name.split(" ")[0]}`); }); });
    out.push(`🚫 Kelmaganlar (${per.label}, ${scopeTxt}): ${missing.length} holat.\n` + astFmtList(missing, 12));
  }
  if (wantTasks) {
    const tk = TASKS.filter(t => taskEmps(t).some(e => ids.has(String(e))) && t.status !== "closed" && (!t.due || (t.due >= per.from.slice(0,7)+"-01")));
    const undone = tk.filter(t => t.status !== "done");
    const overdue = undone.filter(t => t.due < TODAY);
    const review = tk.filter(t => t.status === "review");
    out.push(`📋 Vazifalar (${scopeTxt}): jami ${tk.length}, bajarilgan ${tk.length-undone.length}, bajarilmagan ${undone.length}, muddati o'tgan ${overdue.length}, tasdiq kutayotgan ${review.length}.`);
    if (overdue.length) out.push("Muddati o'tganlar:\n" + astFmtList(overdue.map(t => `${t.title} — ${taskEmps(t).map(name).join(", ")} (${uzDate(t.due)})`)));
    else if (undone.length) out.push("Bajarilmaganlar:\n" + astFmtList(undone.map(t => `${t.title} — ${taskEmps(t).map(name).join(", ")} (${uzDate(t.due)})`)));
  }
  if (wantSales) {
    const sum = orders.reduce((s,o)=>s+o.total,0);
    const custs = {}; orders.forEach(o => { const k=o.customer.trim(); custs[k]=(custs[k]||0)+o.total; });
    const prods = {}; orders.forEach(o => { const k=o.productName||"—"; prods[k]=prods[k]||{q:0,s:0}; prods[k].q+=o.qty; prods[k].s+=o.total; });
    const byComp = {}; orders.forEach(o => { const k=o.company||"—"; byComp[k]=(byComp[k]||0)+o.total; });
    out.push(`🛒 Savdo (${per.label}${who.comp?", "+who.comp:""}): ${orders.length} ta zakaz, jami ${fmtMoney(sum)} so'm, ${Object.keys(custs).length} ta mijoz, o'rtacha ${orders.length?fmtMoney(sum/orders.length):0}.`);
    if (Object.keys(byComp).length > 1) out.push("Kompaniyalar:\n" + astFmtList(Object.entries(byComp).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} — ${fmtMoney(v)}`)));
    if (orders.length) {
      out.push("Eng katta mijozlar:\n" + astFmtList(Object.entries(custs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} — ${fmtMoney(v)}`), 5));
      out.push("Tovarlar:\n" + astFmtList(Object.entries(prods).sort((a,b)=>b[1].s-a[1].s).map(([k,v])=>`${k} — ${v.q} dona, ${fmtMoney(v.s)}`), 5));
    }
  }
  if (wantAtt && !wantLate && !wantAbsent) {
    const days = [...new Set(att.map(a=>a.date))].length;
    const hrs = att.reduce((s,a)=> s + (a.out ? Math.max(0,(Math.min(minutes(a.out),minutes("18:00"))-Math.max(minutes(a.in),minutes(WORK_START)))/60-1) : 0), 0);
    const byEmp = {}; att.forEach(a => { byEmp[a.emp]=(byEmp[a.emp]||0)+1; });
    out.push(`📅 Davomat (${per.label}, ${scopeTxt}): ${days} ish kuni, ${att.length} belgilash, jami ${hrs.toFixed(1)} soat.`);
    out.push(astFmtList(Object.entries(byEmp).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`${name(id)} — ${n} kun`)));
  }
  if (wantFine) {
    const manual = fb.filter(f=>f.type==="fine"); const ms = manual.reduce((s,f)=>s+f.amount,0);
    const lateF = att.reduce((s,a)=> s + (a.fineOverride!=null ? a.fineOverride : lateOf(a)*FINE_PER_MIN), 0);
    out.push(`💸 Jarimalar (${per.label}, ${scopeTxt}): qo'lda ${manual.length} ta = ${fmtMoney(ms)}, kechikish uchun ${fmtMoney(lateF)}, jami ${fmtMoney(ms+lateF)} so'm.`);
    if (manual.length) out.push(astFmtList(manual.map(f=>`${name(f.emp)} — ${fmtMoney(f.amount)} (${f.reason||""})`)));
  }
  if (wantBonus) {
    const b = fb.filter(f=>f.type==="bonus"); const bs = b.reduce((s,f)=>s+f.amount,0);
    out.push(`🎁 Bonuslar (${per.label}, ${scopeTxt}): ${b.length} ta = ${fmtMoney(bs)} so'm.`);
    if (b.length) out.push(astFmtList(b.map(f=>`${name(f.emp)} — ${fmtMoney(f.amount)} (${f.reason||""})`)));
  }
  if (wantPiece) {
    const sum = piece.reduce((s,p)=>s+p.qty*p.price,0);
    const byEmp = {}; piece.forEach(p => { byEmp[p.emp]=(byEmp[p.emp]||0)+p.qty*p.price; });
    out.push(`📦 Donabay ish (${per.label}, ${scopeTxt}): ${piece.length} yozuv, jami ${fmtMoney(sum)} so'm.`);
    out.push(astFmtList(Object.entries(byEmp).sort((a,b)=>b[1]-a[1]).map(([id,v])=>`${name(id)} — ${fmtMoney(v)}`)));
  }
  if (wantKpi) {
    // KPI joriy oy ma'lumotidan (effDetail) — boshqa oy so'ralsa arxivga o'tishni maslahat beramiz
    const rows = emps.map(e => ({ e, d: effDetail(e.id) })).filter(x => !x.d.noData).sort((a,b)=>b.d.kpi-a.d.kpi);
    const best = rows.slice(0,3), worst = rows.slice(-3).reverse();
    out.push(`🏆 KPI (${monthLabelLow()}, ${scopeTxt}): o'rtacha ${rows.length?Math.round(rows.reduce((s,x)=>s+x.d.kpi,0)/rows.length):0}%.`);
    if (rows.length) {
      out.push("Eng yaxshi:\n" + astFmtList(best.map(x=>`${x.e.name.split(" ")[0]} — ${x.d.kpi}% (vazifa ${x.d.tDone}/${x.d.tTotal}, vaqtida ${x.d.punct}/${x.d.days})`)));
      if (rows.length > 3) out.push("Eng past:\n" + astFmtList(worst.map(x=>`${x.e.name.split(" ")[0]} — ${x.d.kpi}%`)));
    }
    if (per.label !== "bu oy") out.push("ℹ️ KPI faqat joriy oy uchun hisoblanadi. Boshqa oy KPI si uchun yuqoridagi oy tanlagichdan o'sha oyga o'ting.");
  }
  if (!out.length) {
    // Umumiy xulosa
    const lates = att.filter(a => lateOf(a) > 0).length;
    const undone = TASKS.filter(t => taskEmps(t).some(e=>ids.has(String(e))) && t.status!=="done" && t.status!=="closed").length;
    const sum = orders.reduce((s,o)=>s+o.total,0);
    out.push(`📌 Qisqacha (${per.label}, ${scopeTxt}): davomat ${att.length} belgilash, kechikish ${lates}, bajarilmagan vazifa ${undone}, zakaz ${orders.length} ta = ${fmtMoney(sum)} so'm.`);
    out.push("Aniqroq so'rang: «bu hafta kim kech keldi», «bu oy nechta zakaz», «avgust savdosi», «IT bo'limi vazifalari», «Jasur davomati», «oylar kesimida savdo».");
  }
  return out.join("\n\n");
}
function pgAssistant(){

  return `

function astBubble(h){
  return `<div class="card" style="padding:13px 15px;margin-bottom:10px">
    <div style="font-size:12px;color:var(--muted);margin-bottom:6px">❓ ${esc(h.q)}</div>
    <div style="font-size:13.5px;white-space:pre-wrap;line-height:1.55">${esc(h.a)}</div></div>`;
}
async function astAsk(text){
  const inp = document.getElementById("astInput");
  const q = (text || (inp ? inp.value : "")).trim();
  if (!q) return;
  if (inp) inp.value = "";
  const log = document.getElementById("astLog");
  if (log) log.insertAdjacentHTML("afterbegin", astBubble({ q, a: "⏳ Hisoblanmoqda..." }));
  let a;
  try { a = await astAnswer(q); } catch(e) { a = "Xatolik: " + e.message; }
  AST_HISTORY.unshift({ q, a });
  if (AST_HISTORY.length > 30) AST_HISTORY.pop();
  if (log) log.innerHTML = AST_HISTORY.map(astBubble).join("");
}

let PRODUCTS = [], ORDERS = [];
async function loadOrders(){

    sb.from("products").select("*").order("sort"),
    sb.from("orders").select("*").gte("date", viewMonthStart()).lte("date", viewMonthEnd()).order("date", { ascending:false }),
  ]);

  if (od.data) ORDERS = od.data.map(o => ({ id:o.id, date:o.date, customer:o.customer, product:o.product,
    productName:o.product_name, qty:+o.qty, price:+o.price, total:+o.total, note:o.note, company:o.company, by:o.created_by }));
}
/* Zakaz ruxsati: admin — to'liq; rahbar/direktor — ko'radi; boshqalar — admin bergan darajada */
function ordersAccess(){
  if (USER.role === "admin") return "edit";
  if (USER.ordersAccess === "edit" || USER.ordersAccess === "view") return USER.ordersAccess;
  if (isExec(USER.role)) return "view";
  return "none";
}
function canSeeOrders(){ return ordersAccess() !== "none"; }
function canEditOrders(){ return ordersAccess() === "edit"; }
/* Ruxsati borlar barcha zakazlarni ko'radi (kompaniya savdosi) */
function orderScope(){ return canSeeOrders() ? ORDERS : []; }
/* Xodimning kompaniyasi (bo'limi orqali) */
function empCompany(e){ return (e && e.dept && deptById(e.dept)?.company) || ""; }
function companies(){
  const set = new Set(DEPTS.map(d => d.company).filter(Boolean));
  PRODUCTS.forEach(p => p.company && set.add(p.company));
  return [...set];
}

function odCompanyHint(){
  const q = +($("#odQty")?.value||0), p = +($("#odPrice")?.value||0);
  const el = document.getElementById("odTotal");
  if (el) el.textContent = q && p ? `Jami: ${fmtMoney(q*p)} so'm` : "";

async function addOrder(){
  const customer = $("#odCust").value.trim(), prodId = $("#odProd").value;
  const qty = +$("#odQty").value || 0, price = +$("#odPrice").value || 0;
  const date = $("#odDate").value, note = $("#odNote").value.trim() || null;
  if (!customer) return toast("Mijoz nomini kiriting");
  if (!prodId) return toast("Tovarni tanlang");
  if (qty <= 0) return toast("Sonini kiriting");
  if (price <= 0) return toast("Narxini kiriting");
  const prod = PRODUCTS.find(p => String(p.id) === String(prodId));
  const company = prod?.company || empCompany(USER) || null;
  const rec = { date, customer, product: +prodId, productName: prod?.name, qty, price, total: qty*price, note, company, by: USER.id };
  if (CLOUD) {
    const { data, error } = await sb.from("orders")
      .insert({ date, customer, product: +prodId, product_name: prod?.name, qty, price, note, company, created_by: USER.id })
      .select().single();
    if (error) return toast("Xatolik: " + error.message);
    rec.id = data.id; rec.total = +data.total;
  } else rec.id = Date.now();
  ORDERS.push(rec);
  toast(`Zakaz qo'shildi: ${customer} — ${fmtMoney(qty*price)} ✓`);
  render();
}
async function delOrder(id){
  if (!confirm("Zakaz o'chirilsinmi?")) return;
  if (CLOUD) {
    const { error } = await sb.from("orders").delete().eq("id", id);
    if (error) return toast("Xatolik: " + error.message);
  }
  ORDERS = ORDERS.filter(o => String(o.id) !== String(id));
  toast("O'chirildi"); render();
}
function exportOrders(){
  const rows = [["Sana","Mijoz","Tovar","Soni","Narxi","Jami","Kompaniya","Kiritgan","Izoh"]];

    rows.push([o.date, o.customer, o.productName||"", o.qty, o.price, o.total, o.company||"", empById(o.by)?.name||"", o.note||""]));
  downloadCSV("zakazlar_" + VIEW_MONTH, rows);
}

async function addDept(){

  if (!name) return toast("Bo'lim nomini kiriting");
  const id = name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "d" + Date.now();
  if (CLOUD) {
    const { error } = await sb.from("departments").insert({ id, name, color, company });
    if (error) return toast("Xatolik: " + error.message);
  }
  DEPTS.push({ id, name, color, company });
  toast("Bo'lim qo'shildi ✓"); openDeptModal();
}
async function setDeptCompany(id, company){
  const d = deptById(id); if (!d) return;
  if (CLOUD) {
    const { error } = await sb.from("departments").update({ company: company || null }).eq("id", id);
    if (error) return toast("Xatolik: " + error.message);
  }
  d.company = company || null;
  toast(company ? `${d.name} → ${company}` : "Kompaniya olib tashlandi"); render();

let CONTRACTORS = [], SNAB_ORDERS = [], SNAB_ITEMS = [], SNAB_PAYS = [], SNAB_MSGS = [];
let SNAB_VIEW = { page: "list", contractor: null, order: null }; // list | contractor | order | balance
function snabRole(){
  if (USER.role === "admin" || isExec(USER.role)) return "admin";
  return USER.snabRole || "none";
}
function canSeeSnab(){ return snabRole() !== "none"; }
const seesGoods = () => ["admin","snab","zavsklad"].includes(snabRole());
const seesPay   = () => ["admin","snab","kassir"].includes(snabRole());
async function loadSnab(){
  if (!CLOUD || !canSeeSnab()) return;
  const qs = [
    sb.from("contractors").select("*").order("name"),
    sb.from("snab_orders").select("*").order("created_at", { ascending:false }),
    sb.from("snab_msgs").select("*").order("created_at"),
    seesGoods() ? sb.from("snab_items").select("*") : Promise.resolve({ data: [] }),
    seesPay()   ? sb.from("snab_payments").select("*").order("created_at") : Promise.resolve({ data: [] }),
  ];
  const [ct, so, sm, si, sp] = await Promise.all(qs);

  if (sm.data) SNAB_MSGS = sm.data.map(m => ({ id:m.id, ord:m.ord, author:m.author, authorName:m.author_name, text:m.text, kind:m.kind, scope:m.scope, at:m.created_at }));
  if (si.data) SNAB_ITEMS = si.data.map(i => ({ id:i.id, ord:i.ord, name:i.name, qty:+i.qty, price:+i.price, received:i.received, receivedAt:i.received_at }));
  if (sp.data) SNAB_PAYS = sp.data.map(p => ({ id:p.id, ord:p.ord, amount:+p.amount, purpose:p.purpose, status:p.status, reqBy:p.requested_by, paidBy:p.paid_by, paidAt:p.paid_at, confirmedAt:p.confirmed_at, at:p.created_at }));
}
/* Kontragent balansi: to'langan (tasdiqlangan) − qabul qilingan tovar.
   + → biz PLYUSDAMIZ (postavshik bizga qarz), − → biz QARZDORMIZ */
function ctBalance(cid){
  const ords = SNAB_ORDERS.filter(o => String(o.contractor)===String(cid)).map(o=>String(o.id));
  const goods = SNAB_ITEMS.filter(i => ords.includes(String(i.ord)) && i.received).reduce((s,i)=>s+i.qty*i.price,0);
  const paid = SNAB_PAYS.filter(p => ords.includes(String(p.ord)) && p.status==="confirmed").reduce((s,p)=>s+p.amount,0);
  return { goods, paid, balance: paid - goods };
}
function balTag(b, big){
  const cls = b > 0 ? "success" : b < 0 ? "danger" : "muted";
  const txt = b > 0 ? `+${fmtMoney(b)} plyus` : b < 0 ? `−${fmtMoney(-b)} qarz` : "0 · teng";
  return `<span class="tag ${cls}" style="${big?"font-size:13px;padding:6px 11px":""}">${txt}</span>`;
}
/* Kontragent bilan barcha oldi-berdi — sana bo'yicha, yig'ilib boruvchi qoldiq bilan */
function ctLedger(cid){
  const ords = SNAB_ORDERS.filter(o => String(o.contractor)===String(cid));
  const numOf = id => ords.find(o=>String(o.id)===String(id))?.num || "";
  const ev = [];
  SNAB_ITEMS.filter(i => i.received && ords.some(o=>String(o.id)===String(i.ord))).forEach(i =>
    ev.push({ date:(i.receivedAt||i.at||"").slice(0,10) || TODAY, ord:numOf(i.ord), desc:`${i.name} — ${i.qty} × ${fmtMoney(i.price)}`, goods:i.qty*i.price, pay:0 }));
  SNAB_PAYS.filter(p => p.status==="confirmed" && ords.some(o=>String(o.id)===String(p.ord))).forEach(p =>
    ev.push({ date:(p.confirmedAt||p.paidAt||p.at||"").slice(0,10) || TODAY, ord:numOf(p.ord), desc:`To'lov: ${p.purpose||""}`, goods:0, pay:p.amount }));
  ev.sort((a,b)=>a.date.localeCompare(b.date));
  let bal = 0;
  return ev.map(e => { bal += e.pay - e.goods; return { ...e, bal }; });
}

  new:        ["muted",   "Yangi — tovar kiritilmagan"],
  goods_wait: ["gold",    "Tovar kutilmoqda"],
  pay_wait:   ["gold",    "To'lov kutilmoqda (kassir)"],
  sup_wait:   ["info",    "Postavshik tasdig'i kutilmoqda"],
  both_wait:  ["gold",    "Tovar va to'lov kutilmoqda"],
  done:       ["success", "Yakunlandi ✓"],

};
/* Zakazning HAQIQIY holati — tovar va to'lovlarning ahvolidan hisoblanadi */
function snabStatus(o){
  if (o.status === "closed") return "closed";
  const items = SNAB_ITEMS.filter(i=>String(i.ord)===String(o.id));
  const pays = SNAB_PAYS.filter(p=>String(p.ord)===String(o.id) && p.status!=="rejected");
  if (!items.length && !pays.length) return "new";
  const goodsWait = items.some(i => !i.received);
  const kasWait = pays.some(p => p.status === "requested");
  const supWait = pays.some(p => p.status === "paid");
  if (goodsWait && (kasWait || supWait)) return "both_wait";
  if (goodsWait) return "goods_wait";
  if (kasWait) return "pay_wait";
  if (supWait) return "sup_wait";
  return "done";
}

}
async function setSnabStatus(o, status){
  if (CLOUD) { const { error } = await sb.from("snab_orders").update({ status }).eq("id", o.id); if (error) return toast("Xatolik: "+error.message); }

}

async function paySnab(id){
  const p = SNAB_PAYS.find(x=>String(x.id)===String(id)); if (!p) return;
  if (!confirm(`${fmtMoney(p.amount)} so'm to'landi deb belgilaysizmi?`)) return;

  await snabMsg(p.ord, `💳 Kassir to'lov qildi: ${fmtMoney(p.amount)} — postavshik tasdig'i kutilmoqda`, "paid", "all");
  const o = SNAB_ORDERS.find(x=>String(x.id)===String(p.ord)); if (o) await setSnabStatus(o, "paid");

let STOCK_ITEMS = [], STOCK_MOVES = [];
function stockAccess(){
  if (USER.role === "admin") return "edit";
  if (USER.stockAccess === "edit" || USER.stockAccess === "view") return USER.stockAccess;
  if (isExec(USER.role)) return "view";
  return "none";
}
async function loadStock(){
  if (!CLOUD || stockAccess() === "none") return;
  const [it, mv] = await Promise.all([
    sb.from("stock_items").select("*").order("name"),
    sb.from("stock_moves").select("*").order("date", { ascending:false }).order("id", { ascending:false }),
  ]);
  if (it.data) STOCK_ITEMS = it.data.map(i => ({ id:i.id, name:i.name, color:i.color||"", unit:i.unit||"dona", active:i.active }));
  if (mv.data) STOCK_MOVES = mv.data.map(m => ({ id:m.id, item:m.item, kind:m.kind, qty:+m.qty, price:+m.price, date:m.date, party:m.party, note:m.note, by:m.created_by }));
}
/* Har tovar bo'yicha qoldiq */
function stockBalance(){
  return STOCK_ITEMS.map(i => {
    const mv = STOCK_MOVES.filter(m => String(m.item) === String(i.id));
    const inQ = mv.filter(m=>m.kind==="in").reduce((s,m)=>s+m.qty,0);
    const outQ = mv.filter(m=>m.kind==="out").reduce((s,m)=>s+m.qty,0);
    const lastIn = mv.find(m=>m.kind==="in");
    const inSum = mv.filter(m=>m.kind==="in").reduce((s,m)=>s+m.qty*m.price,0);
    const avg = inQ ? inSum/inQ : 0;
    return { ...i, inQ, outQ, left: inQ - outQ, lastPrice: lastIn?lastIn.price:0, avg, value: (inQ-outQ)*avg };
  });
}

async function addStockMove(kind){
  const name = $("#stName").value.trim(), color = $("#stColor").value.trim();
  const qty = +$("#stQty").value || 0, price = +$("#stPrice").value || 0;
  const date = $("#stDate").value, party = $("#stParty").value.trim() || null, note = $("#stNote").value.trim() || null;
  if (!name) return toast("Tovar nomini kiriting");
  if (qty <= 0) return toast("Sonini kiriting");
  let item = STOCK_ITEMS.find(i => i.name.toLowerCase()===name.toLowerCase() && (i.color||"").toLowerCase()===color.toLowerCase());
  if (kind === "out") {
    if (!item) return toast("Bunday tovar skladda yo'q");
    const b = stockBalance().find(x => String(x.id)===String(item.id));
    if (b.left < qty) return toast(`Qoldiq yetarli emas — mavjud: ${b.left}`);
  }
  if (!item) {
    if (CLOUD) {
      const { data, error } = await sb.from("stock_items").insert({ name, color }).select().single();
      if (error) return toast("Xatolik: " + error.message);
      item = { id:data.id, name, color, unit:"dona", active:true };
    } else item = { id:Date.now(), name, color, unit:"dona", active:true };
    STOCK_ITEMS.push(item);
  }
  const rec = { item:item.id, kind, qty, price, date, party, note, by:USER.id };
  if (CLOUD) {
    const { data, error } = await sb.from("stock_moves").insert({ item:item.id, kind, qty, price, date, party, note, created_by:USER.id }).select().single();
    if (error) return toast("Xatolik: " + error.message);
    rec.id = data.id;
  } else rec.id = Date.now();
  STOCK_MOVES.unshift(rec);
  toast(`${kind==="in"?"Kirim":"Otgruzka"}: ${name}${color?" ("+color+")":""} × ${qty} ✓`);
  render();
}
async function delStockMove(id){
  if (!confirm("Yozuv o'chirilsinmi?")) return;
  if (CLOUD) { const { error } = await sb.from("stock_moves").delete().eq("id", id); if (error) return toast("Xatolik: " + error.message); }
  STOCK_MOVES = STOCK_MOVES.filter(m => String(m.id)!==String(id)); toast("O'chirildi"); render();
}
function exportStock(){
  const rows = [["Tovar","Rangi","Kirim","Chiqim","Qoldiq","Oxirgi narx","O'rtacha narx","Qoldiq qiymati"]];
  stockBalance().forEach(b => rows.push([b.name, b.color, b.inQ, b.outQ, b.left, b.lastPrice, Math.round(b.avg), Math.round(b.value)]));
  downloadCSV("sklad_" + TODAY, rows);
}

let PIECE_JOBS = [], PIECE_ENTRIES = [];
async function loadPiece(){
  if (!CLOUD) return;
  const [pj, pe] = await Promise.all([
    sb.from("piece_jobs").select("*").order("sort"),
    sb.from("piece_entries").select("*").gte("date", viewMonthStart()).lte("date", viewMonthEnd()).order("date", { ascending:false }),
  ]);
  if (pj.data) PIECE_JOBS = pj.data.map(j => ({ id:j.id, name:j.name, price:+j.price, unit:j.unit||"dona", active:j.active, sort:j.sort }));
  if (pe.data) PIECE_ENTRIES = pe.data.map(x => ({ id:x.id, emp:x.emp, date:x.date, job:x.job, qty:+x.qty, price:+x.price, note:x.note, status:x.status||'pending' }));
}
function monthStartIso(){ const d = new Date(); return isoLocal(new Date(d.getFullYear(), d.getMonth(), 1)); }
/* Donabay bo'yicha oylik jami */
function pieceTotal(empId){
  return PIECE_ENTRIES.filter(x => String(x.emp) === String(empId) && x.status === "approved")
    .reduce((s,x) => s + x.qty * x.price, 0);
}
function piecePending(empId){
  return PIECE_ENTRIES.filter(x => String(x.emp) === String(empId) && x.status === "pending")
    .reduce((s,x) => s + x.qty * x.price, 0);
}
/* Kim tasdiqlaydi: bo'lim boshlig'i (o'z xodimi), rahbariyat, admin */
function canApprovePiece(empId){ return canApproveOT({ emp: empId }); }
async function decidePiece(id, status){
  const x = PIECE_ENTRIES.find(p => String(p.id) === String(id)); if (!x) return;
  if (!canApprovePiece(x.emp)) return toast("Sizda tasdiqlash huquqi yo'q");
  if (CLOUD) {
    const { data, error } = await sb.from("piece_entries").update({ status, decided_by: USER.id, decided_at: new Date().toISOString() }).eq("id", x.id).select();
    if (error) return toast("Xatolik: " + error.message);
    if (!data || !data.length) return toast(permErr("supabase-update-19.sql"));
  }
  x.status = status;
  toast(status === "approved" ? "Tasdiqlandi ✓ — hisobga qo'shildi" : "Rad etildi");
  render();
}
async function decidePieceDay(empId, date, status){
  const list = PIECE_ENTRIES.filter(p => String(p.emp)===String(empId) && p.date===date && p.status==="pending");
  for (const x of list) await decidePiece(x.id, status);
}
/* Kim donabay ma'lumotini ko'ra oladi: o'zi, bo'lim boshlig'i, rahbariyat, admin */
function canSeePiece(empId){
  if (String(USER.id) === String(empId)) return true;

function pieceTable(empId, own){
  const rows = PIECE_ENTRIES.filter(x => String(x.emp) === String(empId))
    .sort((a,b)=>b.date.localeCompare(a.date));
  if (!rows.length) return `<div class="card empty">Hali yozuv yo'q</div>`;
  const byDate = {};
  rows.forEach(r => { (byDate[r.date] = byDate[r.date] || []).push(r); });
  return Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).map(date => {
    const list = byDate[date];
    const sum = list.reduce((s,x)=>s+x.qty*x.price,0);
    return `<div class="card" style="margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap">
        <b style="font-size:13.5px">${uzDate(date)}</b>
        ${list.some(x=>x.status==="pending") && canApprovePiece(empId) && !isArchive()
          ? `<button class="btn success sm" onclick="decidePieceDay('${empId}','${date}','approved')">✓ Kunni tasdiqlash</button>` : ""}
        <span class="num" style="margin-left:auto;font-weight:800;color:var(--success)">${fmtMoney(list.filter(x=>x.status==="approved").reduce((s,x)=>s+x.qty*x.price,0))}</span></div>
      ${list.map(x => { const j = PIECE_JOBS.find(y=>String(y.id)===String(x.job));
        const st = x.status || "pending";
        const stTag = st==="approved" ? '<span class="tag success">✓</span>' : st==="rejected" ? '<span class="tag danger">rad</span>' : '<span class="tag gold">kutmoqda</span>';
        const appr = st==="pending" && canApprovePiece(x.emp) && !isArchive()
          ? `<button class="btn success sm" onclick="decidePiece('${x.id}','approved')">✓</button>
             <button class="btn ghost sm" onclick="decidePiece('${x.id}','rejected')">✗</button>` : "";
        return `<div class="fb-item">
          <div class="fb-icon" style="background:var(--accent-soft);color:var(--accent)">📦</div>
          <div class="meta"><b>${j?esc(j.name):"—"} ${stTag}</b><span>${x.qty} ${j?esc(j.unit):"dona"} × ${fmtMoney(x.price)}</span></div>
          <div class="amount num" style="${st!=="approved"?"color:var(--muted)":""}">${fmtMoney(x.qty*x.price)}</div>
          ${appr}
          ${(own && st==="pending") || USER.role==="admin" ? `<button class="btn sm" style="color:var(--danger)" onclick="delPiece('${x.id}')">✕</button>` : ""}
        </div>`; }).join("")}
    </div>`;
  }).join("");
}

/* ---------- REYTING (hammaga ochiq, KPI bo'yicha) ---------- */
function kpiFromNums(n){
  const parts = [];
  const sundayBonus = Math.min(10, (+n.sundays || 0) * 2);
  if (+n.t_total) parts.push([n.t_done / n.t_total, 0.6]);
  if (+n.t_done)  parts.push([n.on_time / n.t_done, 0.2]);
  if (+n.days)    parts.push([n.punct / n.days, 0.2]);
  const wSum = parts.reduce((s,p) => s + p[1], 0);
  if (!wSum) return 0;
  return Math.min(100, Math.round(parts.reduce((s,p) => s + p[0]*p[1], 0) / wSum * 100) + sundayBonus);
}
function ratingRows(list){
  const medal = i => i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `<b class="num" style="color:var(--muted)">${i+1}</b>`;

    r.noData = !(+r.t_total || +r.days);

        <span>vazifa ${r.t_done}/${r.t_total} · muddatida ${r.on_time} · vaqtida kelish ${r.punct}/${r.days} kun · ${(+r.hours).toFixed(1)} soat</span></div>
      <div class="amount num">${r.noData ? "—" : r.kpi + "%"}<small>${r.noData ? "ma'lumot yo'q" : "KPI"}</small></div>

}
