<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GM Pulse — Samaradorlik Nazorati</title>
<meta name="description" content="Xodimlar davomati, vazifalar, KPI, jarima va bonuslar nazorati">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#149E93">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ============ KIRISH (demo rol tanlash) ============ -->
<div id="login">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M5 19V13M12 19V6M19 19v-9"/></svg>
    </div>
    <h1>GM Pulse</h1>
    <p>Tizimga login va parol bilan kiring. Hisoblar va rollar (xodim, bo'lim boshlig'i, rahbar) faqat admin tomonidan yaratiladi va belgilanadi.</p>
    <div class="card" style="padding:18px">
      <label style="margin-top:0">Login</label>
      <input id="loginUser" placeholder="masalan, admin" autocomplete="username">
      <label>Parol</label>
      <input id="loginPass" type="password" placeholder="••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn primary" style="width:100%;justify-content:center;margin-top:16px" onclick="doLogin()">Kirish</button>
      <div id="loginErr" style="color:var(--danger);font-size:12.5px;font-weight:700;margin-top:9px;display:none">Login yoki parol noto'g'ri</div>
    </div>
    <div style="display:none" id="loginHint"></div>
  </div>
</div>

<!-- ============ ASOSIY ILOVA ============ -->
<div id="app">
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M5 19V13M12 19V6M19 19v-9"/></svg></div>
        <div><b>GM Pulse</b><span>Samaradorlik nazorati</span></div>
      </div>
      <nav id="sideNav"></nav>
      <div class="spacer"></div>
      <button class="nav-btn" id="resetBtn" style="display:none" onclick="resetData()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 109-9M3 3v6h6"/></svg><span>Demo tiklash</span></button>
      <div class="side-user" id="sideUser"></div>
    </aside>

    <div>
      <main class="main">
        <div class="topbar">
          <div><h2 id="pageTitle"></h2><div class="sub" id="pageSub"></div></div>
          <div class="right">
            <select id="monthSel" class="month-sel" title="Oy (arxiv)" onchange="setViewMonth(this.value)"></select>
            <div id="bellWrap" style="position:relative">
              <button class="icon-btn" onclick="toggleNotif()" title="Bildirishnomalar" style="position:relative">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 9a6 6 0 10-12 0c0 5-2 6-2 6h16s-2-1-2-6M10.3 20a2 2 0 003.4 0"/></svg>
                <span id="bellBadge" class="bell-badge"></span>
              </button>
              <div id="notifPanel" class="card notif-panel"></div>
            </div>
            <button class="icon-btn" id="installBtn" title="Ilovani o'rnatish" style="display:none">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
            </button>
            <button class="icon-btn" id="themeBtn" title="Tungi/kunduzgi rejim"></button>
            <button class="icon-btn" id="topLogout" title="Chiqish (boshqa hisob bilan kirish)" onclick="logout()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4h3.5A1.5 1.5 0 0120 5.5v13a1.5 1.5 0 01-1.5 1.5H15M10 8l-4 4 4 4M6 12h10"/></svg>
            </button>
          </div>
        </div>
        <div id="page"></div>
      </main>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<!-- Modal va toast -->
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/01-config.js"></script>
<script src="js/02-data.js"></script>
<script src="js/03-helpers.js"></script>
<script src="js/04-notify.js"></script>
<script src="js/05-calc.js"></script>
<script src="js/06-ui-core.js"></script>
<script src="js/07-nav-render.js"></script>
<script src="js/08-assistant.js"></script>
<script src="js/09-orders.js"></script>
<script src="js/10-sales.js"></script>
<script src="js/11-design.js"></script>
<script src="js/12-snab.js"></script>
<script src="js/13-stock.js"></script>
<script src="js/14-piece.js"></script>
<script src="js/15-rating-payroll.js"></script>
<script src="js/16-me-employees.js"></script>
<script src="js/17-tasks.js"></script>
<script src="js/18-attendance.js"></script>
<script src="js/19-finebonus.js"></script>
<script src="js/20-modals.js"></script>
<script src="js/21-boot.js"></script>
</body>
</html>
