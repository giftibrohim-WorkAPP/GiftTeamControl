<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GM Pulse — Samaradorlik Nazorati</title>
<meta name="description" content="Xodimlar davomati, vazifalar, KPI, jarima va bonuslar nazorati">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#149E93">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface2:#ECF1F5; --ink:#17242E; --muted:#62748A;
  --line:#E2E8EF; --accent:#149E93; --accent-ink:#0B6B63; --accent-soft:#DDF2F0;
  --gold:#C98F2B; --gold-soft:#F7EDD9; --danger:#D8534B; --danger-soft:#FBE7E5;
  --success:#3B9E66; --success-soft:#E2F3E9; --info:#4C82E0; --info-soft:#E5EDFB;
  --shadow:0 1px 2px rgba(23,36,46,.05),0 8px 24px -12px rgba(23,36,46,.12);
  --r:14px;
}
html[data-theme="dark"]{
  --bg:#0C141D; --surface:#141F2B; --surface2:#1B2A38; --ink:#E9EFF5; --muted:#8DA2B5;
  --line:#243548; --accent:#1BB5A8; --accent-ink:#7ADDD4; --accent-soft:#123A38;
  --gold:#E0AC4A; --gold-soft:#3A2F17; --danger:#E4736C; --danger-soft:#3E1F1D;
  --success:#5BBF85; --success-soft:#173226; --info:#7AA3EC; --info-soft:#1B2B45;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 28px -14px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.5;min-height:100vh;
  transition:background .25s,color .25s;
}
h1,h2,h3,h4{font-family:'Sora',sans-serif;line-height:1.25}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface2);
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{font-size:12.5px;font-weight:700;color:var(--muted);display:block;margin:12px 0 5px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Kirish ekrani ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{max-width:430px;width:100%}
.login-logo{width:56px;height:56px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.login-logo svg{width:28px;height:28px}
.login-card h1{font-size:26px;margin-bottom:6px}
.login-card>p{color:var(--muted);margin-bottom:22px}
.role-btn{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:10px;
  box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.role-btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.role-btn .meta b{display:block;font-size:15px}
.role-btn .meta span{font-size:12.5px;color:var(--muted)}
.role-btn .tag{margin-left:auto}

/* ---------- Umumiy tuzilma ---------- */
#app{display:none}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;
  display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand .mark svg{width:18px;height:18px}
.brand b{font-family:'Sora';font-size:15px}
.brand span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.nav-btn{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;
  font-weight:600;font-size:14px;color:var(--muted);transition:background .12s,color .12s;text-align:left;width:100%}
.nav-btn svg{width:19px;height:19px;flex-shrink:0}
.nav-btn:hover{background:var(--surface2)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent-ink)}
.sidebar .spacer{flex:1}
.side-user{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--line)}
.side-user .meta b{font-size:13.5px;display:block}
.side-user .meta span{font-size:11.5px;color:var(--muted)}
.logout{color:var(--muted);padding:6px;border-radius:8px;margin-left:auto}
.logout:hover{color:var(--danger);background:var(--danger-soft)}

.main{padding:22px 26px 90px;max-width:1180px;width:100%;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.topbar h2{font-size:21px}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.topbar .right{margin-left:auto;display:flex;gap:9px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.12s}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
.icon-btn svg{width:18px;height:18px}

/* ---------- Komponentlar ---------- */
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:#fff;flex-shrink:0;font-family:'Sora'}
.avatar.lg{width:56px;height:56px;font-size:18px}
.avatar.sm{width:28px;height:28px;font-size:10.5px}
.tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag.accent{background:var(--accent-soft);color:var(--accent-ink)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.danger{background:var(--danger-soft);color:var(--danger)}
.tag.success{background:var(--success-soft);color:var(--success)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.muted{background:var(--surface2);color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-bottom:16px}
.stat{padding:16px 18px}
.stat .lbl{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.stat .lbl svg{width:15px;height:15px}
.stat .val{font-family:'Sora';font-size:23px;font-weight:700}
.stat .delta{font-size:12px;font-weight:700;margin-top:4px}
.section-title{font-size:15px;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.section-title span{color:var(--muted);font-weight:600;font-size:12.5px;margin-left:auto}

.chart-card{padding:18px}
.chart-card h3{font-size:14.5px;margin-bottom:2px}
.chart-card .sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.grid.charts{grid-template-columns:1fr 1fr}
@media(max-width:900px){.grid.charts{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.rowhover:hover td{background:var(--surface2)}
.t-wrap{overflow-x:auto}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:11px;
  font-weight:700;font-size:13.5px;transition:.12s;border:1px solid transparent}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.success{background:var(--success);color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;align-items:start}
@media(max-width:1000px){.kanban{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.kanban{grid-template-columns:1fr}}
.kcol{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:11px}
.kcol h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:7px;
  color:var(--muted);padding:2px 4px 10px}
.kcol h4 .count{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:1px 8px;font-size:11.5px}
.kdot{width:8px;height:8px;border-radius:50%}
.task-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;box-shadow:var(--shadow)}
.task-card .ttl{font-weight:700;font-size:13.5px;margin-bottom:4px}
.task-card .desc{font-size:12.5px;color:var(--muted);margin-bottom:9px}
.task-card .foot{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.task-card .foot .due{margin-left:auto;font-weight:700}
.task-card .due.late{color:var(--danger)}
.task-card .actions{display:flex;gap:7px;margin-top:10px}

/* Davomat / soat kartasi */
.clock-card{padding:22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  background:linear-gradient(135deg,var(--surface),var(--accent-soft));margin-bottom:16px}
.clock-card .time{font-family:'Sora';font-size:40px;font-weight:700;letter-spacing:.01em}
.clock-card .date{color:var(--muted);font-weight:600;font-size:13px}
.clock-card .right{margin-left:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.check-state{font-size:13px;font-weight:700}

/* Ro'yxatlar */
.fb-item{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.fb-item:last-child{border-bottom:none}
.fb-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fb-icon svg{width:17px;height:17px}
.fb-item .meta{flex:1}
.fb-item .meta b{font-size:13.5px;display:block}
.fb-item .meta span{font-size:12.5px;color:var(--muted)}
.fb-item .amount{font-family:'Sora';font-weight:700;font-size:14.5px;white-space:nowrap}
.fb-item .amount small{display:block;font-family:'Manrope';font-weight:600;color:var(--muted);font-size:11px;text-align:right}

.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.emp-card{padding:16px;display:flex;flex-direction:column;gap:11px}
.emp-card .head{display:flex;gap:12px;align-items:center}
.emp-card .head b{display:block;font-size:14.5px}
.emp-card .head span{font-size:12px;color:var(--muted)}
.emp-mini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.emp-mini div{background:var(--surface2);border-radius:10px;padding:7px 4px}
.emp-mini b{font-size:13px;display:block}
.emp-mini span{font-size:10.5px;color:var(--muted);font-weight:700}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,24,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:18px;backdrop-filter:blur(3px)}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:18px;max-width:440px;width:100%;padding:22px;max-height:90vh;overflow-y:auto;border:1px solid var(--line)}
.modal h3{font-size:17px;margin-bottom:4px}
.modal .sub{font-size:13px;color:var(--muted)}
.modal .foot{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);
  padding:11px 20px;border-radius:12px;font-weight:700;font-size:13.5px;opacity:0;transition:.3s;z-index:99;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px;align-items:center}
.bell-badge{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;
  min-width:17px;height:17px;border-radius:99px;display:none;align-items:center;justify-content:center;padding:0 4px}
.notif-panel{position:absolute;right:0;top:46px;width:305px;max-height:340px;overflow-y:auto;display:none;z-index:45;padding:5px}
.notif-panel.open{display:block}
.notif-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 11px;
  border-radius:10px;font-size:12.5px;font-weight:600;line-height:1.4}
.notif-item:hover{background:var(--surface2)}
.btn.rec{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
.day-chip{display:inline-flex;margin:0}
.day-chip input{display:none}
.day-chip span{padding:7px 13px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--surface2)}
.day-chip input:checked+span{background:var(--accent);color:#fff;border-color:var(--accent)}
.emp-pick{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;max-height:170px;overflow-y:auto;padding:2px}
.pick-chip{display:inline-flex;margin:0}
.pick-chip input{display:none}
.pick-chip span{padding:7px 12px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;cursor:pointer;background:var(--surface2)}
.pick-chip input:checked+span{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Davomat akkordeoni */
.acc summary{display:flex;align-items:center;gap:9px;cursor:pointer;list-style:none;padding:13px 16px;font-size:14px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::before{content:"›";font-weight:800;color:var(--muted);transition:transform .15s}
.acc[open]>summary::before{transform:rotate(90deg)}
.day-acc{margin-bottom:11px;padding:0}
.dept-acc{border-top:1px solid var(--line)}
.dept-acc summary{padding:11px 16px;font-size:13px}
.acc-body{padding:4px 12px 12px}
.sub2{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.att-row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.att-row:last-child{border-bottom:none}
.att-who{display:flex;align-items:center;gap:9px;min-width:170px;flex:1}
.att-who b{font-size:13.5px}
.att-cells{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.att-cells>div{display:flex;flex-direction:column;gap:2px}
.att-cells b{font-size:13.5px}
@media(max-width:700px){
  .att-row{flex-direction:column;align-items:stretch;gap:8px;background:var(--surface2);border-radius:12px;padding:11px 12px;margin-bottom:8px;border-bottom:none}
  .att-who{min-width:0}
  .att-cells{gap:10px;justify-content:space-between}
  .att-cells>div{flex:1;min-width:90px}
  .att-row>.btn{align-self:flex-end}
  .acc summary{padding:12px 12px;flex-wrap:wrap}
  .acc-body{padding:4px 8px 10px}
  .kpi-table{display:none}
  .kpi-cards{display:grid;gap:10px}
}
.kpi-cards{display:none}
@media(max-width:820px){.notif-panel{position:fixed;right:12px;left:12px;top:auto;width:auto;margin-top:6px}}
.filters select,.filters input{width:auto;min-width:150px}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13.5px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px}
.bar-row .nm{width:92px;font-weight:700;flex-shrink:0}
.bar-row .track{flex:1;height:9px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:99px;background:var(--accent);transition:width .6s ease}
.bar-row .pc{width:40px;text-align:right;font-weight:800}

/* ---------- Mobil ---------- */
.bottom-nav{display:none}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .main{padding:16px 14px 96px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);
    border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;font-weight:700;color:var(--muted);padding:6px 2px;border-radius:10px}
  .bottom-nav button.active{color:var(--accent-ink)}
  .bottom-nav svg{width:20px;height:20px}
  .clock-card .time{font-size:32px}
  .clock-card .right{margin-left:0;align-items:flex-start;width:100%}
}
/* Telefon: sahifa yon tomonga cho'zilmasin (masshtab "uzoqlashish" muammosi) */
html,body{overflow-x:hidden;max-width:100%}
.grid.charts>*{min-width:0}
.chart-card svg{max-width:100%}
.pay-cards{display:none}
@media(max-width:820px){
  .grid.stats{grid-template-columns:1fr 1fr}
  .stat{padding:13px 14px}
  .stat .val{font-size:19px}
  .topbar h2{font-size:18px}
  .main{overflow-x:hidden}
  .filters .btn{font-size:12px;padding:7px 10px}
}
@media(max-width:700px){
  .pay-table{display:none}
  .pay-cards{display:grid;gap:11px}
  .pay-card{padding:14px}
  .pay-card .top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  .pay-card .top b{font-size:14px;display:block}
  .pay-card .top span{font-size:11.5px;color:var(--muted)}
  .pay-card .net{margin-left:auto;text-align:right;font-family:'Sora';font-weight:700;font-size:15px}
  .pay-card .rows{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12.5px}
  .pay-card .rows div{background:var(--surface2);border-radius:9px;padding:6px 9px}
  .pay-card .rows b{display:block;font-size:13px}
  .pay-card .rows span{color:var(--muted);font-size:10.5px;font-weight:700}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ============ KIRISH (demo rol tanlash) ============ -->
<div id="login">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M5 19V13M12 19V6M19 19v-9"/></svg>
    </div>
    <h1>GM Pulse</h1>
    <p>Tizimga login va parol bilan kiring. Hisoblar va rollar (xodim, bo'lim boshlig'i, rahbar) faqat admin tomonidan yaratiladi va belgilanadi.</p>
    <div class="card" style="padding:18px">
      <label style="margin-top:0">Login</label>
      <input id="loginUser" placeholder="masalan, admin" autocomplete="username">
      <label>Parol</label>
      <input id="loginPass" type="password" placeholder="••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn primary" style="width:100%;justify-content:center;margin-top:16px" onclick="doLogin()">Kirish</button>
      <div id="loginErr" style="color:var(--danger);font-size:12.5px;font-weight:700;margin-top:9px;display:none">Login yoki parol noto'g'ri</div>
    </div>
    <div style="display:none" id="loginHint"></div>
  </div>
</div>

<!-- ============ ASOSIY ILOVA ============ -->
<div id="app">
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M5 19V13M12 19V6M19 19v-9"/></svg></div>
        <div><b>GM Pulse</b><span>Samaradorlik nazorati</span></div>
      </div>
      <nav id="sideNav"></nav>
      <div class="spacer"></div>

  const h = Math.sin(dla/2)**2 + Math.cos(r(la1)) * Math.cos(r(la2)) * Math.sin(dlo/2)**2;

}

/* ============ HISOB-KITOBLAR ============ */
function minutes(t){ const [h,m] = t.split(":").map(Number); return h*60+m; }
const LUNCH_END = "14:00";
const OT_GRACE = 10; // daqiqa: shu oraliqdagi erta kelish/kech ketish ortiqcha vaqt hisoblanmaydi
/* Qo'shimcha vaqt (9:00 dan oldin + 18:00 dan keyin), daqiqada.
   10 daqiqagacha farq imtiyoz — na hisoblanadi, na tasdiq so'raladi. */
function otMinutes(a){
  if (!a.out) return 0;
  const early = Math.max(0, minutes(WORK_START) - minutes(a.in));
  const lateOut = Math.max(0, minutes(a.out) - minutes("18:00"));
  return (early > OT_GRACE ? early : 0) + (lateOut > OT_GRACE ? lateOut : 0);
}
const LUNCH_MAX = 60; // belgilangan obed: 60 daqiqa (13:00–14:00)
let FINE_PER_MIN = 0; // 1 daqiqa kechikish uchun jarima (admin belgilaydi)
/* Kechikkan daqiqalar (kelish). Ruxsat bilan kechirilgan bo'lsa — 0 */
function lateMinutes(a){
  if (!a || a.lateExcused) return 0;
  return Math.max(0, minutes(a.in) - minutes(WORK_START));
}
/* Obeddan kech qaytish daqiqalari (1 soatdan ortig'i). Kechirilgan bo'lsa — 0 */
function lunchLateMinutes(a){
  if (!a || a.lunchExcused || !a.lunchOut || !a.lunchBack) return 0;
  const inWindow = minutes(a.lunchOut) >= minutes(LUNCH_WINDOW_START) && minutes(a.lunchOut) <= minutes(LUNCH_WINDOW_END);
  if (!inWindow) return 0;
  return Math.max(0, (minutes(a.lunchBack) - minutes(a.lunchOut)) - LUNCH_MAX);
}
/* Kechikish uchun avtomatik jarima (1 daqiqa narxi × kechikkan daqiqalar) */
function lateFine(a){
  if (!FINE_PER_MIN) return 0;
  return Math.round((lateMinutes(a) + lunchLateMinutes(a)) * FINE_PER_MIN);
}
/* Reytingga ta'sir qiladigan kechikish (kechirilgan hisobga olinmaydi) */
function countsLate(a){ return lateMinutes(a) > 0; }
function countsLunchLate(a){ return lunchLateMinutes(a) > 0; }
/* Ishlagan soat: obed vaqti ayriladi; qo'shimcha vaqt FAQAT tasdiqlansa qo'shiladi.
   Obed: agar xodim "chiqdim/qaytdim" bosgan bo'lsa — HAQIQIY tafovut hisoblanadi,
   1 soatdan oshsa ortig'i ham ayriladi. Bosmagan bo'lsa — standart 1 soat ayriladi. */
function lunchMinutes(a){
  if (a.lunchOut && a.lunchBack) return Math.max(0, minutes(a.lunchBack) - minutes(a.lunchOut));
  return LUNCH_MAX; // bosilmagan bo'lsa standart 1 soat
}
function workedHours(a){
  if (!a.out) return null;
  const approved = a.ot === "approved";
  const effIn  = approved ? minutes(a.in)  : Math.max(minutes(a.in),  minutes(WORK_START));
  const effOut = approved ? minutes(a.out) : Math.min(minutes(a.out), minutes("18:00"));
  const lunch = lunchMinutes(a);
  let h = (effOut - effIn) / 60 - lunch / 60;
  return Math.max(0, h);
}
function empAttendance(id){ return ATTENDANCE.filter(a => a.emp === id); }
function empFB(id){ return FINEBONUS.filter(f => f.emp === id); }
function sumFB(id, type){
  return empFB(id).filter(f => f.type === type).reduce((s,f) => s + f.amount, 0);
}
// Oy boshidan ishlab topilgani — SOATBAY hisob:
// soatlik stavka = oylik ÷ (26 kun × 8 soat) = oylik ÷ 208
// hisoblangan = soatlik × real ishlagan soat (ortiqcha soat qo'shiladi, kam ishlagani ayriladi)
function earnedToDate(e){
  const att = empAttendance(e.id);
  let hours = 0, days = 0, lateFineSum = 0;
  att.forEach(a => {
    const h = workedHours(a); if (h !== null) { hours += h; days++; }
    lateFineSum += lateFine(a); // kechikish uchun avtomatik jarima
  });
  const hourRate = e.salary / PLAN_TOTAL;
  const base = hourRate * hours;
  const planSoFar = days * PLAN_HOURS;
  const diff = hours - planSoFar;
  const manualFine = sumFB(e.id,"fine");
  const fine = manualFine + lateFineSum;
  return { base, hours, days, hourRate, planSoFar, diff,
           bonus: sumFB(e.id,"bonus"), fine, manualFine, lateFine: lateFineSum,
           total: base + sumFB(e.id,"bonus") - fine };
}

function effDetail(id){
  const t = TASKS.filter(x => isTaskDoer(x, id));
  const done = t.filter(x => x.status === "done");
  const onTime = done.filter(x => !x.doneAt || x.doneAt <= x.due);
  const at = empAttendance(id);
  const punct = at.filter(a => !countsLate(a) && !countsLunchLate(a));
  const tScore = t.length ? done.length / t.length : 0;
  const oScore = done.length ? onTime.length / done.length : 0;
  const pScore = at.length ? punct.length / at.length : 0;
  // KPI faqat MAVJUD ma'lumot qismlaridan hisoblanadi (yo'q qism 100% deb olinmaydi).
  // Umuman ma'lumot bo'lmasa — KPI 0 va "ma'lumot yig'ilmoqda" holati.
  const parts = [];
  if (t.length)    parts.push([tScore, 0.6]);
  if (done.length) parts.push([oScore, 0.2]);
  if (at.length)   parts.push([pScore, 0.2]);
  const wSum = parts.reduce((s,p) => s + p[1], 0);
  const kpi = wSum ? Math.round(parts.reduce((s,p) => s + p[0]*p[1], 0) / wSum * 100) : 0;
  return {
    tTotal: t.length, tDone: done.length, onTime: onTime.length,
    days: at.length, punct: punct.length, noData: wSum === 0,
    tPc: Math.round(tScore * 100), oPc: Math.round(oScore * 100), pPc: Math.round(pScore * 100),
    kpi,
  };
}
function efficiency(id){ return effDetail(id).kpi; }
// Bo'lim bo'yicha jamlangan raqamlar
function deptDetail(deptId){
  const list = EMPLOYEES.filter(e => String(e.dept) === String(deptId));
  const a = { tTotal:0, tDone:0, onTime:0, days:0, punct:0, emps:list.length };
  list.forEach(e => { const d = effDetail(e.id);
    a.tTotal+=d.tTotal; a.tDone+=d.tDone; a.onTime+=d.onTime; a.days+=d.days; a.punct+=d.punct; });
  a.late = a.days - a.punct;
  a.kpi = deptEfficiency(deptId);
  return a;
}
/* KPI tafsiloti bloki (profil va shaxsiy sahifada) */
function kpiBreakdown(e){
  const d = effDetail(e.id);
  const row = (label, val, pc, weight) => `

      <span style="flex:1"><b>${label}</b><br><span style="color:var(--muted)">${val}</span></span>

        <div style="height:100%;width:${pc}%;background:var(--accent);border-radius:99px"></div></div>
      <b class="num" style="width:44px;text-align:right">${pc}%</b>
      <span class="tag muted">${weight}</span>
    </div>`;
  return `<div class="card" style="padding:15px 17px;margin-bottom:15px">
    <b style="font-size:14px">KPI ${d.kpi}% — qanday hisoblandi</b>
    ${row("Vazifalar bajarilishi", `${d.tTotal} tadan ${d.tDone} tasi bajarildi`, d.tPc, "ulushi 60%")}
    ${row("Muddatida topshirish", d.tDone ? `bajarilgan ${d.tDone} tadan ${d.onTime} tasi o'z muddatida` : "hali bajarilgan vazifa yo'q", d.oPc, "ulushi 20%")}
    ${row("O'z vaqtida kelish", `${d.days} ish kunidan ${d.punct} kuni 9:00 gacha kelgan`, d.pPc, "ulushi 20%")}
    <div style="font-size:11.5px;color:var(--muted);margin-top:11px;border-top:1px solid var(--line);padding-top:9px">
      Formula: ${d.tPc}%×0.6 + ${d.oPc}%×0.2 + ${d.pPc}%×0.2 = <b>${d.kpi}%</b></div>
  </div>`;
}
function deptEfficiency(deptId){
  const list = EMPLOYEES.filter(e => e.dept === deptId);
  if (!list.length) return 0;
  return Math.round(list.reduce((s,e) => s + efficiency(e.id), 0) / list.length);
}

function scopeEmployees(){
  if (USER.role === "admin" || isExec(USER.role)) return EMPLOYEES.filter(e => e.role !== "admin");

  return [USER];
}

/* ============ SVG GRAFIKLAR ============ */
function svgLineChart(){
  const W = 460, H = 210, P = 34;
  const min = 55, max = 100;
  const x = i => P + i * (W - P - 12) / (MONTHLY.labels.length - 1);
  const y = v => H - P + 6 - (v - min) / (max - min) * (H - P - 24);
  const series = DEPTS.slice(0, 4).map(d => ({ key: d.id, color: d.color }));
  let grid = "", labels = "";
  [60,70,80,90,100].forEach(v => {
    grid += `<line x1="${P}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
             <text x="${P-7}" y="${y(v)+4}" font-size="10" fill="var(--muted)" text-anchor="end">${v}</text>`;
  });
  MONTHLY.labels.forEach((l,i) => {
    labels += `<text x="${x(i)}" y="${H-8}" font-size="10.5" fill="var(--muted)" text-anchor="middle">${l}</text>`;
  });
  let paths = "";
  series.forEach(s => {
    const vals = monthlySeries(s.key);
    const pts = vals.map((v,i) => `${x(i)},${y(v)}`).join(" ");
    paths += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    vals.forEach((v,i) => { paths += `<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${s.color}"/>`; });
  });
  const legend = DEPTS.map(d =>
    `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:12px;font-weight:700;color:var(--muted)">
      <span style="width:9px;height:9px;border-radius:3px;background:${d.color};display:inline-block"></span>${d.name}</span>`).join("");
  return `<div style="margin-bottom:8px">${legend}</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${labels}${paths}</svg>`;
}
function deptBars(){

        <div class="track"><div class="fill" style="width:${dd.kpi}%;background:${d.color}"></div></div>

/* ============ CSV EKSPORT (Excel ochadi) ============ */
function downloadCSV(name, rows){
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name + ".csv"; a.click();
  URL.revokeObjectURL(a.href);
  toast("CSV yuklab olindi — Excel'da oching");
}
function exportPayroll(){
  const rows = [["Xodim","Lavozim","Oylik maosh","Soatlik stavka","Ishlagan soat","Reja soat","Farq (soat)","Hisoblangan","Bonus","Jarima","Sof to'lov"]];
  scopeEmployees().forEach(e => {
    const r = earnedToDate(e);
    rows.push([e.name, e.pos, e.salary, Math.round(r.hourRate), r.hours.toFixed(1), r.planSoFar,
               r.diff.toFixed(1), Math.round(r.base), r.bonus, r.fine, Math.round(r.total)]);
  });
  downloadCSV("hisob-kitob_iyul-2026", rows);
}

/* --- Hujjatlar (Supabase Storage) --- */
let DOC_TYPES = [], EMP_DOCS = [];
async function loadDocTypes(){
  if (!CLOUD) return;
  const [dt, ed] = await Promise.all([
    sb.from("doc_types").select("*").order("sort"),
    sb.from("emp_docs").select("*"),
  ]);
  if (dt.data) DOC_TYPES = dt.data.map(d => ({ id: d.id, name: d.name, required: d.required, sort: d.sort }));
  if (ed.data) EMP_DOCS = ed.data.map(d => ({ emp: d.emp, type: d.doc_type, file: d.file }));
}
/* Xodimda qaysi majburiy hujjatlar bor / yetishmayapti */
function docStatus(empId){
  const req = DOC_TYPES.filter(d => d.required);
  const mine = EMP_DOCS.filter(d => String(d.emp) === String(empId));
  const have = req.filter(r => mine.some(m => String(m.type) === String(r.id)));
  const missing = req.filter(r => !mine.some(m => String(m.type) === String(r.id)));
  return { total: req.length, have: have.length, missing, ok: req.length > 0 && missing.length === 0 };
}
async function loadDocs(empId){
  const el = document.getElementById("docsList"); if (!el) return;
  await loadDocTypes();
  const { data, error } = await sb.storage.from("docs").list(String(empId), { sortBy: { column: "name" } });
  if (error) { el.innerHTML = `<div class="empty">Xatolik: ${esc(error.message)}</div>`; return; }
  const files = (data || []).filter(f => f.name !== ".emptyFolderPlaceholder");
  const st = docStatus(empId);
  const typeOf = fname => {
    const rec = EMP_DOCS.find(d => String(d.emp) === String(empId) && d.file === fname);
    const t = rec && DOC_TYPES.find(x => String(x.id) === String(rec.type));
    return t ? t.name : null;
  };
  const checklist = DOC_TYPES.length ? `
    <div style="margin-bottom:11px;padding:10px 12px;border-radius:12px;background:var(--surface2)">
      <b style="font-size:12.5px">Hujjatlar to'liqligi: ${st.have}/${st.total}
        ${st.ok ? `<span class="tag success">to'liq ✓</span>` : `<span class="tag danger">${st.missing.length} ta yetishmaydi</span>`}</b>
      ${st.missing.length ? `<div style="font-size:12px;color:var(--muted);margin-top:5px">Yetishmayapti: ${st.missing.map(m=>esc(m.name)).join(", ")}</div>` : ""}
    </div>` : "";
  el.innerHTML = checklist + (files.length ? files.map(f => {
    const tn = typeOf(f.name);
    return `<div class="fb-item"><div class="fb-icon" style="background:var(--info-soft);color:var(--info)">📄</div>
      <div class="meta"><b>${tn ? esc(tn) : esc(f.name)}</b><span>${tn ? esc(f.name) + " · " : ""}${f.metadata ? Math.max(1, Math.round(f.metadata.size/1024)) + " KB" : ""}</span></div>
      <button class="btn ghost sm" data-e="${empId}" data-n="${encodeURIComponent(f.name)}"
        onclick="downloadDoc(this.dataset.e, decodeURIComponent(this.dataset.n))">⬇</button>
      ${USER.role === "admin" ? `<button class="btn sm" style="color:var(--danger)" data-e="${empId}" data-n="${encodeURIComponent(f.name)}"
        onclick="deleteDoc(this.dataset.e, decodeURIComponent(this.dataset.n))">✕</button>` : ""}</div>`;
  }).join("") : `<div class="empty">Hujjat yuklanmagan</div>`);

/* Fayl nomini Supabase Storage qabul qiladigan holatga keltirish.
   Sabab: o'zbek/rus harflari, bo'shliq va maxsus belgilar "Invalid key" xatosini beradi. */
function safeFileName(name){
  const dot = name.lastIndexOf(".");
  let base = dot > 0 ? name.slice(0, dot) : name;
  let ext  = dot > 0 ? name.slice(dot + 1).toLowerCase() : "";
  const map = { "а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo","ж":"j","з":"z","и":"i",
    "й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u",
    "ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"i","ь":"","э":"e","ю":"yu","я":"ya",
    "ў":"o","қ":"q","ғ":"g","ҳ":"h","ʻ":"","ʼ":"","'":"","'":"","'":"" };
  base = base.toLowerCase().split("").map(ch => map[ch] !== undefined ? map[ch] : ch).join("");
  base = base.replace(/[^a-z0-9._-]+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
  if (!base) base = "hujjat";
  base = base.slice(0, 60);
  ext = ext.replace(/[^a-z0-9]/g, "").slice(0, 8);
  return ext ? `${base}.${ext}` : base;
}
async function uploadDoc(empId, input){
  const file = input.files[0]; if (!file) return;
  if (file.size > 10 * 1024 * 1024) { input.value=""; return toast("Fayl 10 MB dan katta"); }
  toast("Yuklanmoqda...");
  const docType = document.getElementById("docTypeSel")?.value || null;
  const clean = safeFileName(file.name);
  const stamped = Date.now().toString(36) + "-" + clean; // nom to'qnashuvining oldini oladi
  const { error } = await sb.storage.from("docs")
    .upload(`${empId}/${stamped}`, file, { upsert: true, contentType: file.type || "application/octet-stream" });
  input.value = "";
  if (error) return toast("Yuklanmadi: " + error.message);
  // Hujjat turini belgilash (agar tanlangan bo'lsa)
  if (docType) {
    const { error: e2 } = await sb.from("emp_docs")
      .upsert({ emp: empId, doc_type: +docType, file: stamped }, { onConflict: "emp,file" });
    if (e2) toast("Tur belgilanmadi: " + e2.message);
  }
  toast("Hujjat yuklandi ✓"); loadDocs(empId);
}
async function downloadDoc(empId, name){
  const { data, error } = await sb.storage.from("docs").createSignedUrl(`${empId}/${name}`, 300);
  if (error || !data) return toast("Ochib bo'lmadi: " + (error?.message || ""));
  window.open(data.signedUrl, "_blank");
}
async function deleteDoc(empId, name){
  const { error } = await sb.storage.from("docs").remove([`${empId}/${name}`]);
  if (error) return toast("Xatolik: " + error.message);
  toast("Hujjat o'chirildi"); loadDocs(empId);
}

/* ---------- REYTING (hammaga ochiq, KPI bo'yicha) ---------- */
function kpiFromNums(n){
  const parts = [];
  if (+n.t_total) parts.push([n.t_done / n.t_total, 0.6]);
  if (+n.t_done)  parts.push([n.on_time / n.t_done, 0.2]);
  if (+n.days)    parts.push([n.punct / n.days, 0.2]);
  const wSum = parts.reduce((s,p) => s + p[1], 0);
  return wSum ? Math.round(parts.reduce((s,p) => s + p[0]*p[1], 0) / wSum * 100) : 0;
}
function ratingRows(list){
  const medal = i => i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `<b class="num" style="color:var(--muted)">${i+1}</b>`;

    r.noData = !(+r.t_total || +r.days);

      <div style="width:30px;text-align:center;font-size:17px;align-self:center">${medal(i)}</div>

        <span>vazifa ${r.t_done}/${r.t_total} · muddatida ${r.on_time} · vaqtida kelish ${r.punct}/${r.days} kun · ${(+r.hours).toFixed(1)} soat</span></div>
      <div class="amount num">${r.noData ? "—" : r.kpi + "%"}<small>${r.noData ? "ma'lumot yo'q" : "KPI"}</small></div>

// Vazifaning barcha mas'ullari (emps massiv bo'lsa undan, aks holda bitta emp)
function taskEmps(t){ return (t.emps && t.emps.length) ? t.emps : [t.emp]; }
function isTaskDoer(t, uid){ return taskEmps(t).some(e => String(e) === String(uid)); }

function taskScope(){
  const ids = scopeEmployees().map(e => String(e.id));
  return TASKS.filter(t =>
    taskEmps(t).some(e => ids.includes(String(e)))  // ko'rish doirasidagi mas'ul
    || isTaskDoer(t, USER.id)                         // o'ziga berilgan (mas'ullardan biri)
    || String(t.by) === String(USER.id)              // o'zi bergan
  );
}
function taskActions(t){
  const isOwner = isTaskDoer(t, USER.id);                   // mas'ullardan biri
  const isGiver = t.by && String(t.by) === String(USER.id); // vazifani bergan
  const isAdmin = USER.role === "admin";
  const canApprove = (isGiver || isAdmin) && !isOwner;
  const canReassignTask = isOwner && USER.canReassign && t.status !== "done";
  let btns = [];
  if (t.status === "new" && (isOwner || isAdmin))
    btns.push(`<button class="btn primary sm" onclick="moveTask('${t.id}','progress')">Boshlash</button>`);
  if (t.status === "progress" && (isOwner || isAdmin))
    btns.push(`<button class="btn primary sm" onclick="moveTask('${t.id}','review')">Tugatdim — tasdiqqa</button>`);
  if (canReassignTask)
    btns.push(`<button class="btn ghost sm" onclick="openReassign('${t.id}')">↪ O'tkazish</button>`);
  if (t.status === "review" && canApprove)
    btns.push(`<button class="btn success sm" onclick="approveTask('${t.id}')">Tasdiqlash</button>

               <button class="btn ghost sm" onclick="moveTask('${t.id}','progress',true)">Qaytarish</button>`);
  return btns.length ? `<div class="actions">${btns.join("")}</div>` : "";

/* ===== Ovozli kiritish ===== */
let recog = null, mediaRec = null, recChunks = [], voiceBlob = null;
function toggleDictate(targetId, btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast("Bu brauzerda ovozdan matn ishlamaydi — Chrome tavsiya etiladi");
  if (recog) { recog.stop(); return; }
  recog = new SR();
  recog.lang = "uz-UZ"; recog.continuous = true; recog.interimResults = false;
  btn.classList.add("rec"); btn.textContent = "⏹ To'xtatish";
  recog.onresult = ev => {
    let t = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++)
      if (ev.results[i].isFinal) t += ev.results[i][0].transcript + " ";
    if (t) { const el = $("#" + targetId); el.value = (el.value + " " + t).trim(); }
  };
  recog.onerror = e => { if (e.error !== "no-speech") toast("Ovoz xatosi: " + e.error); };
  recog.onend = () => { recog = null; btn.classList.remove("rec"); btn.textContent = "🎤 Ovozdan matn"; };
  recog.start(); toast("Gapiring — tugatgach tugmani qayta bosing");
}
async function toggleVoiceNote(btn){
  if (mediaRec && mediaRec.state === "recording") { mediaRec.stop(); return; }
  if (!navigator.mediaDevices?.getUserMedia) return toast("Bu brauzerda mikrofon ishlamaydi");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRec = new MediaRecorder(stream); recChunks = [];
    mediaRec.ondataavailable = e => recChunks.push(e.data);
    mediaRec.onstop = () => {
      voiceBlob = new Blob(recChunks, { type: mediaRec.mimeType || "audio/webm" });
      stream.getTracks().forEach(t => t.stop());
      const p = document.getElementById("vnPrev");
      if (p) { p.style.display = "block"; p.src = URL.createObjectURL(voiceBlob); }
      btn.classList.remove("rec"); btn.textContent = "🎙 Qayta yozish";
      toast("Ovozli izoh tayyor — vazifa bilan birga saqlanadi");
    };
    mediaRec.start();
    btn.classList.add("rec"); btn.textContent = "⏹ Yozishni to'xtatish";
    toast("Yozilmoqda... tugatgach tugmani bosing");
  } catch(e) { toast("Mikrofonga ruxsat berilmadi"); }
}
async function loadVoice(t){
  const el = document.getElementById("vnPlay"); if (!el) return;
  if (t.voiceUrl) { el.src = t.voiceUrl; return; }
  if (CLOUD && t.voice) {
    const { data } = await sb.storage.from("voice").createSignedUrl(t.voice, 600);
    if (data) el.src = data.signedUrl;
  }
}

const WD_SHORT = ["Yak","Du","Se","Chor","Pay","Ju","Sha"];
function repLabel(r){
  if (!r || r === "none") return "";
  if (r === "daily") return "har kuni";
  if (r === "alt") return "kun ora";
  if (r === "weekly") return "har hafta";
  if (r === "monthly") return "har oy";
  if (r.startsWith("days:")) return r.slice(5).split(",").map(n => WD_SHORT[+n] || "").join(", ");
  return r;
}
/* Keyingi muddat. Yakshanba — dam kuni: hech bir takror unga tushmaydi */
function nextDue(due, rep){
  const d = new Date(due + "T00:00:00");
  const skipSun = () => { while (d.getDay() === 0) d.setDate(d.getDate() + 1); };
  if (rep === "daily") { d.setDate(d.getDate() + 1); skipSun(); }
  else if (rep === "alt") { d.setDate(d.getDate() + 2); skipSun(); }
  else if (rep === "weekly") { d.setDate(d.getDate() + 7); skipSun(); }
  else if (rep === "monthly") { d.setMonth(d.getMonth() + 1); skipSun(); }
  else if (rep.startsWith("days:")) {
    const days = rep.slice(5).split(",").map(Number).filter(x => x >= 1 && x <= 6).sort();
    if (days.length) do { d.setDate(d.getDate() + 1); } while (!days.includes(d.getDay()));
    else { d.setDate(d.getDate() + 7); skipSun(); }
  }
  return d.toISOString().slice(0,10);
}

// Joylashuvni olish (ruxsat so'raladi; 6 soniyada javob bo'lmasa — joylashuvsiz davom etadi)
function getGeo(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy || 0 }),
      () => res(null),
      { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 });
  });
}
/* Geofence tekshiruvi: ishxonadan tashqarida bo'lsa null qaytaradi */
async function geoGuard(){
  const g = await getGeo();
  if (!g) { toast("Joylashuv aniqlanmadi — brauzerda joylashuvga ruxsat berib, qayta urinib ko'ring"); return null; }
  g.outside = false; // ishxona radiusidan tashqaridami
  if (OFFICE) {
    const d = Math.round(distMeters(g.lat, g.lng, OFFICE.lat, OFFICE.lng));
    const allow = OFFICE.radius + Math.min(Math.round(g.acc || 0), 30);
    if (d > allow) {
      // Tashqaridan belgilash huquqi: doimiy "ko'chada ishlaydi" (haydovchilar)
      // yoki admin o'sha kunga bergan ruxsat. Aks holda — rad etiladi.
      const allowedOutside = USER.fieldWork || isFieldDay(USER.id, TODAY);
      if (!allowedOutside) {
        toast(`Siz ishxonada emassiz — masofa ~${d} m (ruxsat ${OFFICE.radius} m). Tashqaridan belgilash huquqingiz yo'q.`);
        return null;
      }
      // "Doimiy dala ishchisi" (haydovchi) — tashqarida deb belgilanib, tasdiqqa boradi.
      // "Kunlik ruxsat" — admin oldindan ruxsat bergani uchun tasdiqsiz o'tadi.
      if (USER.fieldWork && !isFieldDay(USER.id, TODAY)) { g.outside = true; g.dist = d; }
    }
  }
  return g;
}

/* Obeddan qaytish (14:00 gacha bosilishi kerak) */
const LUNCH_WINDOW_START = "12:00", LUNCH_WINDOW_END = "15:00"; // haqiqiy obed oynasi
async function checkLunch(){
  const a = ATTENDANCE.find(x => x.emp === USER.id && x.date === TODAY);
  if (!a || a.out) return;
  toast("Joylashuv aniqlanmoqda...");
  if (!(await geoGuard())) return;
  const now = new Date();
  const t = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  if (!a.lunchOut) {
    // OBEDGA CHIQISH
    // Juda erta (obed oynasidan oldin, masalan 9-10) chiqilsa — bu obed emas, ogohlantiramiz
    if (minutes(t) < minutes(LUNCH_WINDOW_START)) {
      if (!confirm(`Hozir soat ${t} — bu obed vaqti emas (obed odatda 13:00 atrofida). Baribir obedga chiqasizmi? Juda erta bo'lgani uchun bu obed sifatida hisobga olinmasligi mumkin.`)) return;
    }
    if (CLOUD) {
      const { error } = await sb.from("attendance").update({ lunch_out: t }).eq("id", a.id);
      if (error) return toast("Xatolik: " + error.message);
    }
    a.lunchOut = t;
    toast("Obedga chiqish qayd etildi: " + t + " — qaytганда yana bosing");
  } else if (!a.lunchBack) {
    // OBEDDAN QAYTISH
    const dur = minutes(t) - minutes(a.lunchOut); // haqiqiy obed davomiyligi
    // "Kech" belgisi: obed 60 daqiqadan oshsa YOKI 14:00 dan kech qaytilsa (odatiy oynada)
    const inWindow = minutes(a.lunchOut) >= minutes(LUNCH_WINDOW_START) && minutes(a.lunchOut) <= minutes(LUNCH_WINDOW_END);
    const late = dur > LUNCH_MAX && inWindow;
    if (CLOUD) {
      const { error } = await sb.from("attendance").update({ lunch_back: t, lunch_late: late }).eq("id", a.id);
      if (error) return toast("Xatolik: " + error.message);
    }
    a.lunchBack = t; a.lunchLate = late;
    toast(late ? `Obeddan qaytdingiz (${t}) — obed ${dur} daqiqa davom etdi, 1 soatdan oshgani ish vaqtidan ayrildi`
               : `Obeddan qaytish qayd etildi: ${t} — obed ${dur} daqiqa`);
  }
  render();
}

async function saveTask(){
  const title = $("#tTitle").value.trim();
  if (!title) return toast("Sarlavhani kiriting");
  const picked = [...document.querySelectorAll(".tEmpChk:checked")].map(i => CLOUD ? i.value : +i.value);
  if (!picked.length) return toast("Kamida bitta mas'ul xodimni tanlang");
  const desc = $("#tDesc").value.trim(), due = $("#tDue").value;
  const empVal = picked[0];                 // asosiy mas'ul (moslik uchun)
  const empsVal = picked.length > 1 ? picked : null; // ko'p bo'lsa massiv
  let trep = $("#tRep") ? $("#tRep").value : "none";
  if (trep === "days") {
    const days = [...document.querySelectorAll("#repDays input:checked")].map(i => i.value);
    if (!days.length) return toast("Hafta kunlaridan kamida bittasini belgilang");
    trep = "days:" + days.join(",");
  }
  if (CLOUD) {
    const { data, error } = await sb.from("tasks")
      .insert({ title, descr: desc, emp: empVal, emps: empsVal, created_by: USER.id, due, status: "new", repeat: trep })
      .select().single();
    if (error) return toast("Xatolik: " + error.message);
    const nt = { id: data.id, title, desc, emp: data.emp, emps: empsVal, by: USER.id, due, status: "new", rep: trep };
    if (voiceBlob) {
      const path = data.id + ".webm";
      const { error: ve } = await sb.storage.from("voice").upload(path, voiceBlob, { upsert: true, contentType: voiceBlob.type });
      if (!ve) { await sb.from("tasks").update({ voice: path }).eq("id", data.id); nt.voice = path; }
      else toast("Ovoz yuklanmadi: " + ve.message);
    }
    TASKS.push(nt);
  } else {
    const nt = { id: Date.now(), title, desc, emp: empVal, emps: empsVal, by: USER.id, due, status: "new", rep: trep };
    if (voiceBlob) nt.voiceUrl = URL.createObjectURL(voiceBlob);
    TASKS.push(nt);
  }
  voiceBlob = null;
  closeModal(); toast("Vazifa berildi"); go("tasks");
}

async function saveEmp(id){
  id = id || "";
  const name = $("#eName").value.trim();
  const login = $("#eLogin").value.trim().toLowerCase();
  const pass  = $("#ePass").value;
  if (!name) return toast("Ismni kiriting");
  if (!id && (!login || !pass)) return toast("Login va parolni kiriting");
  if (!id && !/^[a-z0-9._-]+(@[a-z0-9.-]+)?$/.test(login)) return toast("Login faqat lotin harf va raqamlardan iborat bo'lsin");
  if (!id && EMPLOYEES.some(e => e.login === login)) return toast("Bu login band — boshqasini tanlang");
  const role = $("#eRole").value;
  const palette = ["#149E93","#4C82E0","#C98F2B","#7B5BA6","#2E7D6B","#B5762A","#1B8FA6","#5B7BD8"];
  const color = palette[Math.floor(Math.random()*palette.length)];
  const contract = $("#eContract").value || null;
  const fieldWork = !!$("#eField").checked;
  const canReassign = !!$("#eReassign").checked;
  const fields = { name, pos: $("#ePos").value.trim() || "Xodim",
                   dept: isExec(role) ? null : $("#eDept").value,
                   role, salary: +$("#eSalary").value || 0 };
  if (CLOUD) {
    if (id) { // tahrirlash — profil yangilanadi (login/parol Dashboard orqali)
      const { error } = await sb.from("profiles").update({ ...fields, contract_until: contract, field_work: fieldWork, can_reassign: canReassign }).eq("id", id);
      if (error) return toast("Xatolik: " + error.message);
      Object.assign(empById(id), fields, { contract, fieldWork, canReassign });
    } else {  // yangi hisob — alohida klient orqali (admin sessiyasi saqlanadi)
      const { data, error } = await sbSignup.auth.signUp({
        email: toEmail(login), password: pass,
        options: { data: { ...fields, color, salary: String(fields.salary) } }
      });
      if (error) return toast("Xatolik: " + error.message);
      if (!data.user) return toast("Hisob yaratilmadi — Supabase sozlamalarini tekshiring");
      if (contract || fieldWork || canReassign) await sb.from("profiles").update({ contract_until: contract, field_work: fieldWork, can_reassign: canReassign }).eq("id", data.user.id);
      EMPLOYEES.push({ id: data.user.id, color, login, contract, fieldWork, canReassign, ...fields });
    }
  } else {
    if (id) Object.assign(empById(id), { ...fields, contract, fieldWork, canReassign, login, pass });
    else EMPLOYEES.push({ id: Date.now(), color, login, pass, contract, fieldWork, canReassign, ...fields });
  }
  closeModal(); toast(id ? "Ma'lumotlar yangilandi" : "Xodim qo'shildi va hisob ochildi"); render();
}

/* Supabase'dan barcha ruxsat etilgan ma'lumotlarni yuklash (RLS avtomatik filtrlaydi) */
async function loadAll(){
  const monthStart = TODAY.slice(0,8) + "01";
  const [pr, tk, fb, at, st, dp, fd] = await Promise.all([
    sb.from("profiles").select("*").eq("active", true),
    sb.from("tasks").select("*").order("created_at"),
    sb.from("fine_bonus").select("*").order("date"),
    sb.from("attendance").select("*").gte("date", monthStart).order("date"),
    sb.from("settings").select("*").eq("id", 1).maybeSingle(),
    sb.from("departments").select("*").order("name"),
    sb.from("field_days").select("*").gte("date", monthStart),
  ]);
  if (dp.data && dp.data.length) DEPTS = dp.data.map(d => ({ id: d.id, name: d.name, color: d.color }));
  OFFICE = (st.data && st.data.office_lat != null)
    ? { lat: st.data.office_lat, lng: st.data.office_lng, radius: st.data.radius_m || 100 } : null;
  FINE_PER_MIN = st.data ? (+st.data.fine_per_min || 0) : 0;
  FIELD_DAYS = (fd.data || []).map(f => ({ id: f.id, emp: f.emp, date: f.date, note: f.note }));
  EMPLOYEES = (pr.data || []).map(p => ({ id: p.id, name: p.name, role: p.role, dept: p.dept,
    pos: p.pos, salary: +p.salary, color: p.color, login: toShort(p.email),
    contract: p.contract_until, fieldWork: !!p.field_work, canReassign: !!p.can_reassign }));
  TASKS = (tk.data || []).map(t => {
    const nt = { id: t.id, title: t.title, desc: t.descr, emp: t.emp,
      emps: t.emps || null, by: t.created_by, due: t.due, status: t.status, doneAt: t.done_at,
      rep: t.repeat || "none", voice: t.voice, extended: !!t.extended, duePrev: t.due_prev };
    // Yaqinda mahalliy o'zgartirilgan vazifa (masalan hozirgina tasdiqlangan):
    // bazadan hali eski holat kelsa, mahalliy holatni saqlab qolamiz (orqaga qaytmasin).
    const p = window.__pendingTask && window.__pendingTask[String(t.id)];
    if (p && Date.now() - p.at < 12000) { nt.status = p.status; if (p.status === "done") nt.doneAt = nt.doneAt || TODAY; }
    return nt;
  });
  loadDocTypes();
  FINEBONUS = (fb.data || []).map(f => ({ id: f.id, emp: f.emp, type: f.type,
    amount: +f.amount, reason: f.reason, date: f.date }));
  ATTENDANCE = (at.data || []).map(a => ({ id: a.id, emp: a.emp, date: a.date,
    in: (a.check_in || "").slice(0,5), out: a.check_out ? a.check_out.slice(0,5) : null,
    late: a.late, ot: a.ot_status || "none",
    lunchBack: a.lunch_back ? a.lunch_back.slice(0,5) : null, lunchLate: !!a.lunch_late,
    lunchOut: a.lunch_out ? a.lunch_out.slice(0,5) : null,
    lateExcused: !!a.late_excused, lunchExcused: !!a.lunch_excused,
    excuseNote: a.excuse_note, excuseReq: a.excuse_req || "none",
    inField: !!a.in_field, outField: !!a.out_field, inAppr: a.in_appr || "none", outAppr: a.out_appr || "none",
    outGeo: (a.out_lat != null && a.out_lng != null) ? a.out_lat.toFixed(5) + "," + a.out_lng.toFixed(5) : null,
    geo: (a.lat != null && a.lng != null) ? a.lat.toFixed(5) + "," + a.lng.toFixed(5) : null }));
  normalizeAttendance();
}

async function doLogin(){
  const l = $("#loginUser").value.trim().toLowerCase();
  const p = $("#loginPass").value;
  const err = m => { const e = $("#loginErr"); e.textContent = m; e.style.display = "block"; };
  if (CLOUD) {
    const { data, error } = await sb.auth.signInWithPassword({ email: toEmail(l), password: p });
    if (error) return err("Kirish rad etildi: " + (error.message === "Invalid login credentials" ? "email yoki parol noto'g'ri" : error.message));
    await loadAll();
    const me = EMPLOYEES.find(e => e.id === data.user.id);
    if (!me) { await sb.auth.signOut(); return err("Profil topilmadi yoki faol emas"); }
    enterApp(me);
  } else {
    const u = EMPLOYEES.find(e => e.login === l && e.pass === p);
    if (!u) return err("Login yoki parol noto'g'ri");
    enterApp(u);
  }
  $("#loginErr").style.display = "none";
  $("#loginUser").value = ""; $("#loginPass").value = "";
}

async function refreshNow(){
  if (window.__rtRefresh) { await window.__rtRefresh(); toast("Yangilandi ✓"); }
}
function subscribeRealtime(){
  if (!CLOUD || window.__rt) return;
  const refresh = async () => {
    if (!USER) return;
    if (window.__writing) return; // yozish amali ketayotganda yangilamaymiz (poyga holatini oldini oladi)
    await loadAll();
    const me = EMPLOYEES.find(e => String(e.id) === String(USER.id));
    if (me) USER = me;
    render();
    if (window.__taskOpen && document.getElementById("cmList")) loadComments(window.__taskOpen);
  };
  window.__rtRefresh = refresh;
  window.__rt = sb.channel("gm-live")
    .on("postgres_changes", { event: "*", schema: "public" }, () => {
      clearTimeout(window.__rtT);
      window.__rtT = setTimeout(refresh, 400);
    })
    .subscribe();
  clearInterval(window.__poll);
  window.__poll = setInterval(() => { if (USER && !document.hidden) refresh(); }, 25000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && USER) refresh(); });
}
/* Yozish amalini o'rab, shu davrda Realtime yangilashini to'xtatadi.
   Yozish tugagach, mahalliy o'zgarish bazaga aniq yetib borishi uchun qisqa muhlat qoldiradi. */
async function guardWrite(fn){
  window.__writing = true;
  try { return await fn(); }
  finally { setTimeout(() => { window.__writing = false; }, 1500); }
}
function enterApp(u){
  USER = u;

}

let clockTimer = null;
function startClock(){
  clearInterval(clockTimer);
  const tick = () => {
    const el = document.getElementById("liveClock");
    if (!el) return;
    const n = new Date();
    el.textContent = `${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}:${String(n.getSeconds()).padStart(2,"0")}`;
  };
  tick(); clockTimer = setInterval(tick, 1000);
}
