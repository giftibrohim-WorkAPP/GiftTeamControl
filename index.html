/* Yopilgan vazifa ham "Bajarildi" ustunida ko'rinadi (belgisi bilan) */
function colOf(t){ return t.status === "closed" ? "done" : t.status; }
// Vazifaning barcha mas'ullari (emps massiv bo'lsa undan, aks holda bitta emp)
/* Muddat o'tganmi (sana + soat bilan) */
function taskOverdue(t){
  if (t.status === "done" || t.status === "closed") return false;
  if (t.due < TODAY) return true;
  if (t.due > TODAY) return false;
  if (!t.dueTime) return false;                   // faqat sana berilgan — kun oxirigacha vaqt bor
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  return nowMin > minutes(t.dueTime);
}
function dueLabel(t){ return uzDate(t.due) + (t.dueTime ? ` ${t.dueTime}` : ""); }
function taskEmps(t){ return (t.emps && t.emps.length) ? t.emps : [t.emp]; }
function isTaskDoer(t, uid){ return taskEmps(t).some(e => String(e) === String(uid)); }

function taskScope(){
  const ids = scopeEmployees().map(e => String(e.id));
  return TASKS.filter(t =>
    taskEmps(t).some(e => ids.includes(String(e)))  // ko'rish doirasidagi mas'ul
    || isTaskDoer(t, USER.id)                         // o'ziga berilgan (mas'ullardan biri)
    || String(t.by) === String(USER.id)              // o'zi bergan
  );
}
function taskActions(t){
  const isOwner = isTaskDoer(t, USER.id);                   // mas'ullardan biri
  const isGiver = t.by && String(t.by) === String(USER.id); // vazifani bergan
  const isAdmin = USER.role === "admin";
  const canApprove = (isGiver || isAdmin) && !isOwner;
  // Kim o'tkaza oladi: ruxsati bor mas'ul, vazifani bergan, rahbariyat, admin
  const canReassignTask = t.status !== "done" && t.status !== "closed" &&
    ((isOwner && USER.canReassign) || isGiver || isAdmin || isExec(USER.role));
  let btns = [];
  if (t.status === "new" && (isOwner || isAdmin))
    btns.push(`<button class="btn primary sm" onclick="moveTask('${t.id}','progress')">Boshlash</button>`);
  if (t.status === "progress" && (isOwner || isAdmin))
    btns.push(`<button class="btn primary sm" onclick="moveTask('${t.id}','review')">Tugatdim — tasdiqqa</button>`);
  if (canReassignTask)
    btns.push(`<button class="btn ghost sm" onclick="openReassign('${t.id}')">↪ O'tkazish</button>`);
  // Takrorlanuvchi vazifani to'xtatish — faqat bergan odam yoki admin
  if (t.rep && t.rep !== "none" && (isGiver || isAdmin))
    btns.push(`<button class="btn ghost sm" onclick="stopRepeat('${t.id}')" title="Hozirgi vazifa qoladi, keyingi nusxa ochilmaydi">⏹ Takrorni to'xtatish</button>`);
  // Vazifani BUTUNLAY yopish — ish umuman tugadi, boshqa kerak emas
  if (t.status !== "done" && t.status !== "closed" && (isGiver || isAdmin))
    btns.push(`<button class="btn ghost sm" style="color:var(--danger)" onclick="closeTask('${t.id}')" title="Vazifa butunlay yopiladi va takrorlanmaydi">✖ Butunlay yopish</button>`);
  if (t.status === "review" && canApprove)
    btns.push(`<button class="btn success sm" onclick="approveTask('${t.id}')">Tasdiqlash</button>
               <button class="btn ghost sm" onclick="openExtend('${t.id}')">📅 Muddatni cho'zish</button>
               <button class="btn ghost sm" onclick="moveTask('${t.id}','progress',true)">Qaytarish</button>`);
  return btns.length ? `<div class="actions">${btns.join("")}</div>` : "";
}

/* ===== Ovozli kiritish ===== */
let recog = null, mediaRec = null, recChunks = [], voiceBlob = null;
function toggleDictate(targetId, btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast("Bu brauzerda ovozdan matn ishlamaydi — Chrome tavsiya etiladi");
  if (recog) { recog.stop(); return; }
  recog = new SR();
  recog.lang = "uz-UZ"; recog.continuous = true; recog.interimResults = false;
  btn.classList.add("rec"); btn.textContent = "⏹ To'xtatish";
  recog.onresult = ev => {
    let t = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++)
      if (ev.results[i].isFinal) t += ev.results[i][0].transcript + " ";
    if (t) { const el = $("#" + targetId); el.value = (el.value + " " + t).trim(); }
  };
  recog.onerror = e => { if (e.error !== "no-speech") toast("Ovoz xatosi: " + e.error); };
  recog.onend = () => { recog = null; btn.classList.remove("rec"); btn.textContent = "🎤 Ovozdan matn"; };
  recog.start(); toast("Gapiring — tugatgach tugmani qayta bosing");
}
async function toggleVoiceNote(btn){
  if (mediaRec && mediaRec.state === "recording") { mediaRec.stop(); return; }
  if (!navigator.mediaDevices?.getUserMedia) return toast("Bu brauzerda mikrofon ishlamaydi");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRec = new MediaRecorder(stream); recChunks = [];
    mediaRec.ondataavailable = e => recChunks.push(e.data);
    mediaRec.onstop = () => {
      voiceBlob = new Blob(recChunks, { type: mediaRec.mimeType || "audio/webm" });
      stream.getTracks().forEach(t => t.stop());
      const p = document.getElementById("vnPrev");
      if (p) { p.style.display = "block"; p.src = URL.createObjectURL(voiceBlob); }
      btn.classList.remove("rec"); btn.textContent = "🎙 Qayta yozish";
      toast("Ovozli izoh tayyor — vazifa bilan birga saqlanadi");
    };
    mediaRec.start();
    btn.classList.add("rec"); btn.textContent = "⏹ Yozishni to'xtatish";
    toast("Yozilmoqda... tugatgach tugmani bosing");
  } catch(e) { toast("Mikrofonga ruxsat berilmadi"); }
}
async function loadVoice(t){
  const el = document.getElementById("vnPlay"); if (!el) return;
  if (t.voiceUrl) { el.src = t.voiceUrl; return; }
  if (CLOUD && t.voice) {
    const { data } = await sb.storage.from("voice").createSignedUrl(t.voice, 600);
    if (data) el.src = data.signedUrl;
  }
}

const WD_SHORT = ["Yak","Du","Se","Chor","Pay","Ju","Sha"];
function repLabel(r){
  if (!r || r === "none") return "";
  if (r === "daily") return "har kuni";
  if (r === "alt") return "kun ora";
  if (r === "weekly") return "har hafta";
  if (r === "monthly") return "har oy";
  if (r.startsWith("days:")) return r.slice(5).split(",").map(n => WD_SHORT[+n] || "").join(", ");
  return r;
}
/* Keyingi muddat. Yakshanba — dam kuni: hech bir takror unga tushmaydi */
function nextDue(due, rep){
  const d = new Date(due + "T00:00:00");
  const skipSun = () => { while (d.getDay() === 0) d.setDate(d.getDate() + 1); };
  if (rep === "daily") { d.setDate(d.getDate() + 1); skipSun(); }
  else if (rep === "alt") { d.setDate(d.getDate() + 2); skipSun(); }
  else if (rep === "weekly") { d.setDate(d.getDate() + 7); skipSun(); }
  else if (rep === "monthly") { d.setMonth(d.getMonth() + 1); skipSun(); }
  else if (rep.startsWith("days:")) {
    const days = rep.slice(5).split(",").map(Number).filter(x => x >= 1 && x <= 6).sort();
    if (days.length) do { d.setDate(d.getDate() + 1); } while (!days.includes(d.getDay()));
    else { d.setDate(d.getDate() + 7); skipSun(); }
  }
  return isoLocal(d);
}

// Joylashuvni olish (ruxsat so'raladi; 6 soniyada javob bo'lmasa — joylashuvsiz davom etadi)
function getGeo(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy || 0 }),
      () => res(null),
      { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 });
  });
}
/* Geofence tekshiruvi: ishxonadan tashqarida bo'lsa null qaytaradi */
async function geoGuard(){
  const g = await getGeo();
  if (!g) { toast("Joylashuv aniqlanmadi — brauzerda joylashuvga ruxsat berib, qayta urinib ko'ring"); return null; }
  g.outside = false; // ishxona radiusidan tashqaridami
  if (OFFICE) {
    const d = Math.round(distMeters(g.lat, g.lng, OFFICE.lat, OFFICE.lng));
    const allow = OFFICE.radius + Math.min(Math.round(g.acc || 0), 30);
    if (d > allow) {
      // Tashqaridan belgilash huquqi: doimiy "ko'chada ishlaydi" (haydovchilar)
      // yoki admin o'sha kunga bergan ruxsat. Aks holda — rad etiladi.
      const allowedOutside = USER.fieldWork || isFieldDay(USER.id, TODAY);
      if (!allowedOutside) {
        toast(`Siz ishxonada emassiz — masofa ~${d} m (ruxsat ${OFFICE.radius} m). Tashqaridan belgilash huquqingiz yo'q.`);
        return null;
      }
      // "Doimiy dala ishchisi" (haydovchi) — tashqarida deb belgilanib, tasdiqqa boradi.
      // "Kunlik ruxsat" — admin oldindan ruxsat bergani uchun tasdiqsiz o'tadi.
      if (USER.fieldWork && !isFieldDay(USER.id, TODAY)) { g.outside = true; g.dist = d; }
    }
  }
  return g;
}

  if (String(a.emp) === String(USER.id)) return false; // o'zini tasdiqlay olmaydi
  const emp = empById(a.emp);
  if (!emp) return false;
  // Direktor, rahbar, admin — hammani tasdiqlaydi

  return false;
}

const LEAVE_MIN_HOURS = 3; // ruxsat kamida shuncha soat OLDIN so'ralishi kerak
let LEAVE_REQS = [];       // oldindan ruxsat so'rovlari

async function loadLeaves(){
  if (!CLOUD) return;
  const from = isArchive() ? viewMonthStart() : isoLocal(new Date(Date.now() - 30*86400000));
  const to = isArchive() ? viewMonthEnd() : isoLocal(new Date(Date.now() + 60*86400000));
  const { data } = await sb.from("leave_requests").select("*").gte("date", from).lte("date", to).order("date", { ascending:false });
  if (data) LEAVE_REQS = data.map(r => ({ id:r.id, emp:r.emp, date:r.date, kind:r.kind,
    fromTime:r.from_time ? String(r.from_time).slice(0,5) : null, reason:r.reason,
    status:r.status, requestedAt:r.requested_at }));
}
function approvedLeave(empId, date){
  return LEAVE_REQS.find(r => String(r.emp)===String(empId) && r.date===date && r.status==="approved");
}
function pendingLeave(empId, date){
  return LEAVE_REQS.find(r => String(r.emp)===String(empId) && r.date===date && r.status==="pending");
}
/* Kamida 3 soat oldin so'ralganmi? */
function leaveInTime(date, fromTime){
  const target = new Date(date + "T" + (fromTime || WORK_START) + ":00");
  return (target - new Date()) / 3600000 >= LEAVE_MIN_HOURS;
}
function canDecideLeave(r){
  if (!r || r.status !== "pending") return false;
  return canApproveOT({ emp: r.emp });
}
function leaveKindLabel(k){ return { late:"kechikib kelish", early:"erta ketish", absent:"kelmaslik" }[k] || k; }

async function sendLeave(){
  const kind = $("#lvKind").value, date = $("#lvDate").value;
  const fromTime = kind === "absent" ? null : $("#lvTime").value;
  const reason = $("#lvReason").value.trim();
  if (!reason) return toast("Sababni yozing");
  if (!leaveInTime(date, fromTime))
    return toast(`Kamida ${LEAVE_MIN_HOURS} soat oldin so'rash kerak — keyinroq vaqtni tanlang`);
  if (pendingLeave(USER.id, date)) return toast("Bu kunga so'rov allaqachon yuborilgan");
  const rec = { emp: USER.id, date, kind, fromTime, reason, status:"pending", requestedAt:new Date().toISOString() };
  if (CLOUD) {
    const { data, error } = await sb.from("leave_requests")
      .insert({ emp: USER.id, date, kind, from_time: fromTime, reason }).select().single();
    if (error) return toast("Xatolik: " + error.message);
    rec.id = data.id;
  } else rec.id = Date.now();
  LEAVE_REQS.push(rec);
  closeModal(); toast("So'rov yuborildi — boshliq tasdiqlashini kuting"); render();
}
async function decideLeave(id, status){
  const r = LEAVE_REQS.find(x => String(x.id) === String(id));
  if (!r) return;
  if (!canDecideLeave(r)) return toast("Sizda bu so'rovni tasdiqlash huquqi yo'q");
  if (CLOUD) {
    const { data, error } = await sb.from("leave_requests")
      .update({ status, decided_by: USER.id, decided_at: new Date().toISOString() }).eq("id", r.id).select();
    if (error) return toast("Xatolik: " + error.message);
    if (!data || !data.length) return toast(permErr("supabase-update-12.sql"));

  r.status = status;
  toast(status === "approved" ? "Ruxsat berildi ✓ — kechikish hisobga olinmaydi va jarima yozilmaydi" : "Ruxsat rad etildi");
  render();
}

async function decideField(emp, date, which, status){

  const col = which === "in" ? "in_appr" : "out_appr";

      if (!ve) { await sb.from("tasks").update({ voice: path }).eq("id", data.id); nt.voice = path; }
      else toast("Ovoz yuklanmadi: " + ve.message);

                 dueTime, forAll, status: "new", rep: trep };

async function saveEmp(id){
  id = id || "";
  const name = $("#eName").value.trim();
  const login = $("#eLogin").value.trim().toLowerCase();
  const pass  = $("#ePass").value;
  if (!name) return toast("Ismni kiriting");
  if (!id && (!login || !pass)) return toast("Login va parolni kiriting");
  if (!id && !/^[a-z0-9._-]+(@[a-z0-9.-]+)?$/.test(login)) return toast("Login faqat lotin harf va raqamlardan iborat bo'lsin");
  if (!id && EMPLOYEES.some(e => e.login === login)) return toast("Bu login band — boshqasini tanlang");
  const role = $("#eRole").value;
  const palette = ["#149E93","#4C82E0","#C98F2B","#7B5BA6","#2E7D6B","#B5762A","#1B8FA6","#5B7BD8"];
  const color = palette[Math.floor(Math.random()*palette.length)];
  const contract = $("#eContract").value || null;
  const fieldWork = !!$("#eField").checked;
  const canReassign = !!$("#eReassign").checked;
  const fields = { name, pos: $("#ePos").value.trim() || "Xodim",
                   dept: isExec(role) ? null : $("#eDept").value,
                   role, salary: +$("#eSalary").value || 0 };
  if (CLOUD) {
    if (id) { // tahrirlash — profil yangilanadi (login/parol Dashboard orqali)
      const { error } = await sb.from("profiles").update({ ...fields, contract_until: contract, field_work: fieldWork, can_reassign: canReassign }).eq("id", id);
      if (error) return toast("Xatolik: " + error.message);
      Object.assign(empById(id), fields, { contract, fieldWork, canReassign });
    } else {  // yangi hisob — alohida klient orqali (admin sessiyasi saqlanadi)
      const { data, error } = await sbSignup.auth.signUp({
        email: toEmail(login), password: pass,
        options: { data: { ...fields, color, salary: String(fields.salary) } }
      });
      if (error) return toast("Xatolik: " + error.message);
      if (!data.user) return toast("Hisob yaratilmadi — Supabase sozlamalarini tekshiring");
      if (contract || fieldWork || canReassign) await sb.from("profiles").update({ contract_until: contract, field_work: fieldWork, can_reassign: canReassign }).eq("id", data.user.id);
      EMPLOYEES.push({ id: data.user.id, color, login, contract, fieldWork, canReassign, ...fields });
    }
  } else {
    if (id) Object.assign(empById(id), { ...fields, contract, fieldWork, canReassign, login, pass });
    else EMPLOYEES.push({ id: Date.now(), color, login, pass, contract, fieldWork, canReassign, ...fields });
  }
  closeModal(); toast(id ? "Ma'lumotlar yangilandi" : "Xodim qo'shildi va hisob ochildi"); render();
}

  const monthStart = viewMonthStart(), monthEnd = viewMonthEnd();
  const [pr, tk, fb, at, st, dp, fd] = await Promise.all([
    sb.from("profiles").select("*").eq("active", true),
    sb.from("tasks").select("*").order("created_at"),
    sb.from("fine_bonus").select("*").gte("date", monthStart).lte("date", monthEnd).order("date"),
    sb.from("attendance").select("*").gte("date", monthStart).lte("date", monthEnd).order("date"),
    sb.from("settings").select("*").eq("id", 1).maybeSingle(),
    sb.from("departments").select("*").order("name"),
    sb.from("field_days").select("*").gte("date", monthStart).lte("date", monthEnd),
  ]);
  if (dp.data && dp.data.length) DEPTS = dp.data.map(d => ({ id: d.id, name: d.name, color: d.color, company: d.company || null }));
  OFFICE = (st.data && st.data.office_lat != null)
    ? { lat: st.data.office_lat, lng: st.data.office_lng, radius: st.data.radius_m || 100 } : null;
  FINE_PER_MIN = st.data ? (+st.data.fine_per_min || 0) : 0;
  FIELD_DAYS = (fd.data || []).map(f => ({ id: f.id, emp: f.emp, date: f.date, note: f.note }));
  EMPLOYEES = (pr.data || []).map(p => ({ id: p.id, name: p.name, role: p.role, dept: p.dept,
    pos: p.pos, salary: +p.salary, color: p.color, login: toShort(p.email),
    contract: p.contract_until, fieldWork: !!p.field_work, canReassign: !!p.can_reassign,
    photo: p.photo || null, piecework: !!p.piecework, ordersAccess: p.orders_access || "none",
    stockAccess: p.stock_access || "none", snabRole: p.snab_role || "none" }));
  TASKS = (tk.data || []).map(t => {
    const nt = { id: t.id, title: t.title, desc: t.descr, emp: t.emp,
      emps: t.emps || null, by: t.created_by, due: t.due, status: t.status, doneAt: t.done_at,
      rep: t.repeat || "none", voice: t.voice, extended: !!t.extended, duePrev: t.due_prev,
      dueTime: t.due_time ? String(t.due_time).slice(0,5) : null, forAll: !!t.for_all };
    // Yaqinda mahalliy o'zgartirilgan vazifa (masalan hozirgina tasdiqlangan):
    // bazadan hali eski holat kelsa, mahalliy holatni saqlab qolamiz (orqaga qaytmasin).
    const p = window.__pendingTask && window.__pendingTask[String(t.id)];
    if (p && Date.now() - p.at < 12000) { nt.status = p.status; if (p.status === "done") nt.doneAt = nt.doneAt || TODAY; }
    return nt;
  });
  loadDocTypes(); loadLeaves(); loadPiece(); loadOrders(); loadStock(); loadSnab();
  FINEBONUS = (fb.data || []).map(f => ({ id: f.id, emp: f.emp, type: f.type,
    amount: +f.amount, reason: f.reason, date: f.date }));
  ATTENDANCE = (at.data || []).map(a => ({ id: a.id, emp: a.emp, date: a.date,
    in: (a.check_in || "").slice(0,5), out: a.check_out ? a.check_out.slice(0,5) : null,
    late: a.late, ot: a.ot_status || "none",
    lunchBack: a.lunch_back ? a.lunch_back.slice(0,5) : null, lunchLate: !!a.lunch_late,
    lunchOut: a.lunch_out ? a.lunch_out.slice(0,5) : null,
    lateExcused: !!a.late_excused, lunchExcused: !!a.lunch_excused,
    fineOverride: a.fine_override != null ? +a.fine_override : null,
    excuseNote: a.excuse_note, excuseReq: a.excuse_req || "none",
    excuseAt: a.excuse_at, excuseLate: !!a.excuse_late, adminExcused: !!a.admin_excused,
    inField: !!a.in_field, outField: !!a.out_field, inAppr: a.in_appr || "none", outAppr: a.out_appr || "none",
    outGeo: (a.out_lat != null && a.out_lng != null) ? a.out_lat.toFixed(5) + "," + a.out_lng.toFixed(5) : null,
    geo: (a.lat != null && a.lng != null) ? a.lat.toFixed(5) + "," + a.lng.toFixed(5) : null }));
  normalizeAttendance();
}

async function doLogin(){
  const l = $("#loginUser").value.trim().toLowerCase();
  const p = $("#loginPass").value;
  const err = m => { const e = $("#loginErr"); e.textContent = m; e.style.display = "block"; };
  if (CLOUD) {
    const { data, error } = await sb.auth.signInWithPassword({ email: toEmail(l), password: p });
    if (error) return err("Kirish rad etildi: " + (error.message === "Invalid login credentials" ? "email yoki parol noto'g'ri" : error.message));
    await loadAll();
    const me = EMPLOYEES.find(e => e.id === data.user.id);
    if (!me) { await sb.auth.signOut(); return err("Profil topilmadi yoki faol emas"); }
    enterApp(me);
  } else {
    const u = EMPLOYEES.find(e => e.login === l && e.pass === p);
    if (!u) return err("Login yoki parol noto'g'ri");
    enterApp(u);
  }
  $("#loginErr").style.display = "none";
  $("#loginUser").value = ""; $("#loginPass").value = "";
}

async function refreshNow(){
  if (window.__rtRefresh) { await window.__rtRefresh(); toast("Yangilandi ✓"); }
}
function subscribeRealtime(){
  if (!CLOUD || window.__rt) return;
  const refresh = async () => {
    if (!USER) return;
    if (window.__writing) return; // yozish amali ketayotganda yangilamaymiz (poyga holatini oldini oladi)
    await loadAll();
    const me = EMPLOYEES.find(e => String(e.id) === String(USER.id));
    if (me) USER = me;
    render();
    if (window.__taskOpen && document.getElementById("cmList")) loadComments(window.__taskOpen);
    AST_CACHE = {};
    checkNewNotifs();
  };
  window.__rtRefresh = refresh;
  window.__rt = sb.channel("gm-live")
    .on("postgres_changes", { event: "*", schema: "public" }, () => {
      clearTimeout(window.__rtT);
      window.__rtT = setTimeout(refresh, 400);
    })
    .subscribe();
  clearInterval(window.__poll);
  window.__poll = setInterval(() => { if (USER && !document.hidden) refresh(); }, 25000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && USER) refresh(); });
}
/* Yozish amalini o'rab, shu davrda Realtime yangilashini to'xtatadi.
   Yozish tugagach, mahalliy o'zgarish bazaga aniq yetib borishi uchun qisqa muhlat qoldiradi. */
async function guardWrite(fn){
  window.__writing = true;
  try { return await fn(); }
  finally { setTimeout(() => { window.__writing = false; }, 1500); }
}
function enterApp(u){
  USER = u;
  PAGE = (USER.role === "xodim") ? "me" : "dashboard";
  $("#login").style.display = "none";
  $("#app").style.display = "block";
  render(); startClock(); subscribeRealtime(); __seenNotif = null; checkNewNotifs();
  toast(`Xush kelibsiz, ${USER.name.split(" ")[0]}!`);
}

// Sessiya saqlangan bo'lsa avtomatik kirish
if (CLOUD) {
  sb.auth.getSession().then(async ({ data }) => {
    if (!data.session) return;
    await loadAll();
    const me = EMPLOYEES.find(e => e.id === data.session.user.id);
    if (me) enterApp(me);
  });
}

function setTheme(t){
  document.documentElement.dataset.theme = t;
  $("#themeBtn").innerHTML = t === "dark" ? IC.sun : IC.moon;
  if (USER) saveState();
}

/* Jonli soat */
let clockTimer = null;
function startClock(){
  clearInterval(clockTimer);
  const tick = () => {
    const el = document.getElementById("liveClock");
    if (!el) return;
    const n = new Date();
    el.textContent = `${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}:${String(n.getSeconds()).padStart(2,"0")}`;
  };
  tick(); clockTimer = setInterval(tick, 1000);
}

/* POSTAVSHIK: ?sup=TOKEN bir marta ochilsa — token telefonda eslab qolinadi.
   Keyin ilova (bosh ekrandan) oddiy ochilganda ham to'g'ridan postavshik kabineti chiqadi. */
(function(){
  let tok = new URLSearchParams(location.search).get("sup");
  if (tok) { try { localStorage.setItem("gm_sup_token", tok); } catch(e){} history.replaceState(null, "", location.pathname); }
  else { try { tok = localStorage.getItem("gm_sup_token"); } catch(e){} }
  if (tok) { window.__supMode = true; setTimeout(() => supplierPage(tok), 50); }
})();
function supExit(){
  if (!confirm("Postavshik kabinetidan chiqilsinmi? Qayta kirish uchun havola kerak bo'ladi.")) return;
  try { localStorage.removeItem("gm_sup_token"); } catch(e){}
  location.href = location.pathname;
}

/* PWA: service worker + o'rnatish tugmasi */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").catch(()=>{});

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e;
  const b = $("#installBtn"); if (b) b.style.display = "flex";
  const sb2 = document.getElementById("supInstallBtn"); if (sb2) sb2.style.display = "inline-flex";

$("#installBtn").addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null; $("#installBtn").style.display = "none";
});
